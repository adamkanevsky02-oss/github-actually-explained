<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub, Actually Explained — an interactive, hands-on tour</title>
<style>
/* ==========================================================================
   0. TOKENS
   GitHub dark theme tokens (--gh-*) are exact, from the project brief.
   Tutorial chrome tokens (--t-*) are DELIBERATELY different in hue so the
   commentary can never be mistaken for real GitHub UI.
   ========================================================================== */
:root{
  /* --- GitHub dark (do not invent new ones) --- */
  --gh-canvas-default:#0d1117;
  --gh-canvas-subtle:#161b22;
  --gh-canvas-overlay:#161b22;
  --gh-canvas-inset:#010409;
  --gh-border-default:#30363d;
  --gh-border-muted:#21262d;
  --gh-fg-default:#e6edf3;
  --gh-fg-muted:#8b949e;
  --gh-fg-subtle:#6e7681;
  --gh-accent-fg:#2f81f7;
  --gh-accent-emphasis:#1f6feb;
  --gh-success-fg:#3fb950;
  --gh-btn-primary-bg:#238636;
  --gh-btn-primary-hover:#2ea043;
  --gh-btn-bg:#21262d;
  --gh-btn-hover:#30363d;
  --gh-danger-fg:#f85149;
  --gh-done-fg:#a371f7;
  --gh-attention-fg:#d29922;
  --gh-open-fg:#3fb950;
  --gh-neutral-emphasis:#6e7681;
  --gh-tab-active:#fd7e14;
  --gh-diff-add:#0d4429;
  --gh-diff-del:#67060c;
  --gh-diff-add-gutter:#1b7f3b;
  --gh-diff-del-gutter:#8d1c24;

  /* --- Tutorial chrome (bluer/warmer, never GitHub) --- */
  --t-bg:#12141c;
  --t-bg-2:#171a24;
  --t-panel:#1b1f2b;
  --t-panel-2:#212636;
  --t-border:#2e3446;
  --t-border-2:#465071;
  --t-fg:#e2e6f2;
  --t-muted:#a0a8c0;
  --t-dim:#7b839b;
  --t-accent:#f2b544;      /* amber = "this is the tutorial talking" */
  --t-accent-2:#4dd4c4;    /* teal  = "this is a hotspot" */
  --t-danger:#ff7b72;
  --t-good:#5ad07a;

  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --rail-w:248px;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--t-bg);
  color:var(--t-fg);
  font-family:var(--font-sans);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--t-accent);outline-offset:2px;border-radius:4px}

/* ==========================================================================
   1. TUTORIAL CHROME — rail, topbar, main column
   ========================================================================== */
.tut-app{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);min-height:100vh}

.tut-rail{
  background:linear-gradient(180deg,#141826 0%,#10131c 100%);
  border-right:1px solid var(--t-border);
  position:sticky;top:0;height:100vh;overflow-y:auto;padding:20px 14px 40px;
}
.tut-rail__brand{display:flex;gap:10px;align-items:flex-start;padding:4px 8px 16px}
.tut-rail__mark{
  width:30px;height:30px;flex:0 0 30px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--t-accent),#e08b2f);color:#1a1206;
}
.tut-rail__mark .octicon{width:18px;height:18px}
.tut-rail__title{display:block;font-size:14px;font-weight:700;letter-spacing:.2px;line-height:1.25}
.tut-rail__sub{display:block;font-size:11.5px;color:var(--t-dim);line-height:1.35;margin-top:3px}

.tut-rail__label{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--t-dim);
  padding:10px 8px 6px;font-weight:700;
}
.tut-modlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.tut-modlink{
  display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;
  background:none;border:0;border-radius:8px;padding:8px 10px;cursor:pointer;
  color:var(--t-muted);font-size:13px;line-height:1.35;
}
.tut-modlink:hover{background:var(--t-panel);color:var(--t-fg)}
.tut-modlink[aria-current="true"]{background:var(--t-panel-2);color:#fff;box-shadow:inset 3px 0 0 var(--t-accent)}
.tut-modlink[disabled]{opacity:.42;cursor:not-allowed}
.tut-modlink[disabled]:hover{background:none;color:var(--t-muted)}
.tut-modnum{
  flex:0 0 22px;height:22px;border-radius:50%;display:grid;place-items:center;
  font-size:11px;font-weight:700;background:#242a3a;color:var(--t-muted);border:1px solid var(--t-border);
}
.tut-modlink[aria-current="true"] .tut-modnum{background:var(--t-accent);color:#1a1206;border-color:transparent}
.tut-modlink.is-done .tut-modnum{background:rgba(90,208,122,.16);color:var(--t-good);border-color:rgba(90,208,122,.4)}
.tut-modlink.is-done .tut-modnum .octicon{width:12px;height:12px}
.tut-modttl{font-weight:600;color:inherit}
.tut-modsoon{font-size:10.5px;color:var(--t-dim);font-style:italic}

.tut-rail__note{
  margin:18px 6px 0;padding:10px 12px;border:1px dashed var(--t-border);border-radius:8px;
  font-size:11.5px;color:var(--t-dim);line-height:1.5;
}

/* main column */
.tut-main{min-width:0;display:flex;flex-direction:column}
.tut-topbar{
  position:sticky;top:0;z-index:40;background:rgba(18,20,28,.93);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--t-border);padding:12px 32px 0;
}
.tut-topbar__row{display:flex;align-items:center;gap:16px;padding-bottom:12px}
.tut-crumbs{font-size:12px;color:var(--t-dim);flex:1;min-width:0}
.tut-crumbs b{color:var(--t-fg);font-weight:600}
.tut-navbtns{display:flex;gap:8px}
.tut-btn{
  background:var(--t-panel);border:1px solid var(--t-border);color:var(--t-fg);
  border-radius:8px;padding:6px 13px;font-size:12.5px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
}
.tut-btn:hover{background:var(--t-panel-2);border-color:#465071}
.tut-btn[disabled]{opacity:.4;cursor:not-allowed}
.tut-btn--accent{background:var(--t-accent);color:#1a1206;border-color:transparent}
.tut-btn--accent:hover{background:#ffc85e;border-color:transparent}
.tut-progress{height:3px;background:#242a3a;border-radius:2px;overflow:hidden}
.tut-progress__fill{height:100%;background:linear-gradient(90deg,var(--t-accent),var(--t-accent-2));transition:width .3s}

.tut-body{padding:34px 26px 120px;max-width:1260px;width:100%}

/* module header */
.tut-modhead{margin-bottom:30px}
.tut-eyebrow{
  font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--t-accent);
}
.tut-modhead h1{font-size:31px;line-height:1.2;margin:8px 0 10px;font-weight:700;letter-spacing:-.4px}
.tut-blurb{font-size:16.5px;color:var(--t-muted);max-width:70ch;margin:0}
.tut-goals{
  margin:22px 0 0;padding:16px 18px;border:1px solid var(--t-border);border-radius:10px;
  background:linear-gradient(180deg,var(--t-panel) 0%,rgba(27,31,43,.4) 100%);
}
.tut-goals h2{font-size:11px;text-transform:uppercase;letter-spacing:.1em;margin:0 0 10px;color:var(--t-dim)}
.tut-goals ul{margin:0;padding:0;list-style:none;display:grid;gap:7px}
.tut-goals li{display:flex;gap:9px;font-size:14px;color:var(--t-muted)}
.tut-goals li .octicon{flex:0 0 16px;margin-top:3px;color:var(--t-accent-2)}

/* ==========================================================================
   2. TUTORIAL SECTION BLOCKS (prose / callout / steps / compare / terms / recap)
   ========================================================================== */
.tut-sec{margin:0 0 30px}
.tut-prose{max-width:74ch}
.tut-prose h2{font-size:22px;font-weight:700;margin:38px 0 12px;letter-spacing:-.2px}
.tut-prose h3{font-size:16.5px;font-weight:700;margin:26px 0 8px}
.tut-prose p{margin:0 0 14px}
.tut-prose ul,.tut-prose ol{margin:0 0 14px;padding-left:22px}
.tut-prose li{margin-bottom:7px}
.tut-prose strong{color:#fff}
.tut-prose em{color:var(--t-muted)}
.tut-prose a{color:var(--t-accent-2)}
.tut-prose code,.tut-code{
  font-family:var(--font-mono);font-size:.86em;background:#232838;border:1px solid var(--t-border);
  border-radius:5px;padding:1.5px 5px;color:#ffd79a;white-space:nowrap;
}
.tut-prose pre{
  background:#0f1219;border:1px solid var(--t-border);border-radius:9px;padding:14px 16px;
  overflow-x:auto;font-family:var(--font-mono);font-size:12.5px;line-height:1.6;color:#cfd6e6;
}
.tut-prose pre code{background:none;border:0;padding:0;color:inherit;white-space:pre}
.tut-prose blockquote{
  margin:0 0 14px;padding:2px 0 2px 16px;border-left:3px solid var(--t-border);color:var(--t-muted);
}
.tut-lead{font-size:17px;color:var(--t-fg)}

/* callouts */
.tut-callout{
  border:1px solid var(--t-border);border-left-width:4px;border-radius:10px;
  padding:14px 18px;background:var(--t-panel);max-width:78ch;
}
.tut-callout__ttl{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;margin-bottom:6px}
.tut-callout__ttl .octicon{flex:0 0 16px}
.tut-callout p:last-child{margin-bottom:0}
.tut-callout p{margin:0 0 10px;font-size:14.5px;color:var(--t-muted)}
.tut-callout strong{color:#fff}
.tut-callout--info{border-left-color:var(--t-accent-2)}
.tut-callout--info .tut-callout__ttl{color:var(--t-accent-2)}
.tut-callout--tip{border-left-color:var(--t-good)}
.tut-callout--tip .tut-callout__ttl{color:var(--t-good)}
.tut-callout--warn{border-left-color:var(--t-accent);background:rgba(242,181,68,.06)}
.tut-callout--warn .tut-callout__ttl{color:var(--t-accent)}
.tut-callout--danger{border-left-color:var(--t-danger);background:rgba(255,123,114,.06)}
.tut-callout--danger .tut-callout__ttl{color:var(--t-danger)}
.tut-callout--moment{
  border:1px solid rgba(242,181,68,.45);border-left:4px solid var(--t-accent);
  background:linear-gradient(100deg,rgba(242,181,68,.11),rgba(77,212,196,.05));
}
.tut-callout--moment .tut-callout__ttl{color:var(--t-accent);font-size:14px}
.tut-callout--moment .tut-callout__tag{
  font-size:10px;letter-spacing:.09em;text-transform:uppercase;background:var(--t-accent);color:#1a1206;
  border-radius:20px;padding:2px 9px;font-weight:800;margin-left:auto;
}

/* steps */
.tut-steps{max-width:78ch}
.tut-steps h2{font-size:20px;margin:0 0 14px;font-weight:700}
.tut-steps ol{list-style:none;counter-reset:s;margin:0;padding:0}
.tut-steps li{
  counter-increment:s;position:relative;padding:0 0 18px 42px;border-left:1px dashed var(--t-border);
  margin-left:13px;
}
.tut-steps li:last-child{border-left-color:transparent;padding-bottom:0}
.tut-steps li::before{
  content:counter(s);position:absolute;left:-13px;top:-2px;width:26px;height:26px;border-radius:50%;
  background:var(--t-panel-2);border:1px solid var(--t-border);color:var(--t-accent);
  font-size:12px;font-weight:800;display:grid;place-items:center;
}
.tut-steps__lbl{display:block;font-weight:700;font-size:14.5px;margin-bottom:3px}
.tut-steps__body{font-size:14.5px;color:var(--t-muted)}
.tut-steps__body p{margin:0 0 8px}

/* compare (wrong vs right) */
.tut-compare{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:1000px}
.tut-compare h2{grid-column:1/-1;font-size:20px;margin:0 0 2px;font-weight:700}
.tut-cmp{border:1px solid var(--t-border);border-radius:10px;overflow:hidden;background:var(--t-panel)}
.tut-cmp__hd{
  padding:9px 14px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px;
  border-bottom:1px solid var(--t-border);
}
.tut-cmp--bad .tut-cmp__hd{background:rgba(255,123,114,.12);color:var(--t-danger)}
.tut-cmp--good .tut-cmp__hd{background:rgba(90,208,122,.12);color:var(--t-good)}
.tut-cmp__bd{padding:14px;font-size:14px;color:var(--t-muted)}
.tut-cmp__bd p{margin:0 0 10px}
.tut-cmp__bd p:last-child{margin:0}
.tut-cmp__bd code{font-family:var(--font-mono);font-size:12.5px;background:#232838;border:1px solid var(--t-border);border-radius:5px;padding:1.5px 5px;color:#ffd79a}

/* terms / glossary */
.tut-terms{max-width:80ch}
.tut-terms h2{font-size:20px;margin:0 0 14px;font-weight:700}
.tut-terms dl{margin:0;display:grid;gap:1px;background:var(--t-border);border:1px solid var(--t-border);border-radius:10px;overflow:hidden}
.tut-terms dt{background:var(--t-panel);padding:12px 16px 4px;font-weight:700;font-size:14px;color:#fff}
.tut-terms dd{background:var(--t-panel);margin:0;padding:0 16px 13px;font-size:14px;color:var(--t-muted)}
.tut-terms dd code{font-family:var(--font-mono);font-size:12.5px;color:#ffd79a}

/* recap */
.tut-recap{
  max-width:80ch;border:1px solid var(--t-border);border-radius:12px;padding:18px 22px;
  background:linear-gradient(150deg,rgba(77,212,196,.07),rgba(27,31,43,.6));
}
.tut-recap h2{font-size:17px;margin:0 0 12px;display:flex;align-items:center;gap:8px;color:var(--t-accent-2)}
.tut-recap ul{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.tut-recap li{display:flex;gap:10px;font-size:14.5px;color:var(--t-muted)}
.tut-recap li .octicon{flex:0 0 16px;margin-top:4px;color:var(--t-good)}
.tut-recap strong{color:#fff}

/* ==========================================================================
   3. THE FRAME — every fake GitHub screen lives inside this. It is amber-lit
   and captioned so it can never be confused with the tutorial's own voice.
   ========================================================================== */
.ghframe{margin:0 0 30px;max-width:1200px}
.ghframe__cap{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:0 2px 9px;font-size:12px;color:var(--t-dim);
}
.ghframe__chip{
  display:inline-flex;align-items:center;gap:6px;background:rgba(242,181,68,.14);
  border:1px solid rgba(242,181,68,.4);color:var(--t-accent);border-radius:20px;
  padding:2px 10px;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
}
.ghframe__chip .octicon{width:12px;height:12px}
.ghframe__label{color:var(--t-muted);font-weight:600;font-size:12.5px}
.ghframe__tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.ghframe__count{font-size:11.5px;color:var(--t-dim);font-variant-numeric:tabular-nums}

.ghframe__shell{
  border:1px solid var(--t-border-2);border-radius:12px;background:var(--t-panel);
  padding:8px 8px 8px;box-shadow:0 0 0 1px rgba(242,181,68,.16),0 22px 48px rgba(0,0,0,.55);
}
.ghframe__urlbar{display:flex;align-items:center;gap:9px;padding:3px 4px 9px}
.ghframe__dots{display:flex;gap:6px;padding-left:3px}
.ghframe__dots i{width:10px;height:10px;border-radius:50%;background:#39405a;display:block}
.ghframe__dots i:nth-child(1){background:#e0625b}
.ghframe__dots i:nth-child(2){background:#dfa64a}
.ghframe__dots i:nth-child(3){background:#59b064}
.ghframe__url{
  flex:1;min-width:0;background:#0f1219;border:1px solid var(--t-border);border-radius:20px;
  padding:4px 12px;font-family:var(--font-mono);font-size:11.5px;color:var(--t-muted);
  display:flex;align-items:center;gap:7px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.ghframe__url .octicon{width:12px;height:12px;color:var(--t-dim);flex:0 0 12px}
.ghframe__url b{color:#fff;font-weight:600}
.ghframe__url .u-dim{color:var(--t-dim)}

.ghframe__body{
  position:relative;overflow:hidden;border-radius:8px;
  border:1px solid var(--gh-border-default);background:var(--gh-canvas-default);
  /* The replica must respond to the FRAME's width, not the browser window's —
     otherwise a 930px-wide fake screen lays itself out as if it had 1280px. */
  container-type:inline-size;container-name:ghscreen;
}

/* --- hotspot layer --- */
/* Must sit ABOVE .gh-menu (z-index:30) or markers pointing at open dropdown
   items become unclickable, and BELOW the sticky tutorial topbar (z-index:40). */
.hs-layer{position:absolute;inset:0;pointer-events:none;z-index:34}
.hs-spot{
  position:absolute;border-radius:6px;pointer-events:none;opacity:0;
  outline:2px solid var(--t-accent);outline-offset:2px;
  box-shadow:0 0 0 9999px rgba(1,4,9,.66);
  transition:opacity .13s ease, top .13s ease, left .13s ease, width .13s ease, height .13s ease;
}
.hs-spot.is-on{opacity:1}
.hs-marker{
  position:absolute;width:22px;height:22px;border-radius:50%;pointer-events:auto;cursor:pointer;
  border:2px solid #1a1206;background:var(--t-accent);color:#1a1206;
  font-size:11px;font-weight:800;font-family:var(--font-sans);line-height:1;
  display:grid;place-items:center;padding:0;
  box-shadow:0 2px 8px rgba(0,0,0,.6);transition:transform .12s ease, background .12s ease;
  z-index:22;
}
.hs-marker:hover,.hs-marker:focus-visible{transform:scale(1.22);background:#ffd479}
.hs-marker.is-active{background:var(--t-accent-2);color:#05221f;transform:scale(1.22)}
.hs-marker.is-seen{box-shadow:0 0 0 2px rgba(77,212,196,.55),0 2px 8px rgba(0,0,0,.6)}
.hs-marker:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* --- explanation drawer --- */
.hs-panel{
  position:fixed;top:0;right:0;height:100vh;width:400px;max-width:92vw;z-index:120;
  background:linear-gradient(180deg,#171b28,#12141c);border-left:1px solid var(--t-border-2);
  box-shadow:-24px 0 60px rgba(0,0,0,.55);
  transform:translateX(102%);transition:transform .22s cubic-bezier(.2,.8,.3,1);
  display:flex;flex-direction:column;
}
.hs-panel.is-open{transform:none}
.hs-panel__hd{
  display:flex;align-items:flex-start;gap:11px;padding:16px 16px 13px;
  border-bottom:1px solid var(--t-border);
}
.hs-panel__num{
  flex:0 0 26px;height:26px;border-radius:50%;background:var(--t-accent);color:#1a1206;
  font-size:12px;font-weight:800;display:grid;place-items:center;
}
.hs-panel__num.is-event{background:var(--t-accent-2);color:#05221f}
.hs-panel__num .octicon{width:14px;height:14px}
.hs-panel__ttl{font-size:15.5px;font-weight:700;line-height:1.3;flex:1;min-width:0}
.hs-panel__kicker{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--t-dim);font-weight:700;margin-bottom:3px}
.hs-panel__x{
  background:none;border:1px solid var(--t-border);color:var(--t-muted);border-radius:7px;
  width:28px;height:28px;display:grid;place-items:center;cursor:pointer;flex:0 0 28px;
}
.hs-panel__x:hover{background:var(--t-panel-2);color:#fff}
.hs-panel__bd{padding:14px 16px 24px;overflow-y:auto;flex:1;font-size:14px;line-height:1.62}
.hs-panel__bd p{margin:0 0 11px}
.hs-panel__bd code{font-family:var(--font-mono);font-size:12.3px;background:#232838;border:1px solid var(--t-border);border-radius:5px;padding:1.5px 5px;color:#ffd79a}
.hs-panel__bd strong{color:#fff}
.hs-panel__bd ul{margin:0 0 11px;padding-left:20px}
.hs-panel__bd li{margin-bottom:6px}
.hs-row{margin:0 0 15px}
.hs-row__k{
  display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:800;letter-spacing:.09em;
  text-transform:uppercase;margin-bottom:5px;
}
.hs-row__k .octicon{width:13px;height:13px}
.hs-row__v{color:var(--t-muted)}
.hs-row__v p:last-child{margin-bottom:0}
.hs-row--what .hs-row__k{color:var(--t-accent-2)}
.hs-row--why  .hs-row__k{color:var(--t-accent)}
.hs-row--how  .hs-row__k{color:#8fb4ff}
.hs-row--fail .hs-row__k{color:var(--t-danger)}
.hs-row--when .hs-row__k{color:var(--t-good)}
.hs-panel__ft{
  border-top:1px solid var(--t-border);padding:11px 16px;display:flex;align-items:center;gap:8px;
  background:rgba(0,0,0,.2);
}
.hs-panel__pos{font-size:11.5px;color:var(--t-dim);margin-right:auto;font-variant-numeric:tabular-nums}

/* toast */
.tut-toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,28px);z-index:200;
  background:#1d2230;border:1px solid var(--t-border-2);border-left:3px solid var(--t-accent-2);
  color:var(--t-fg);border-radius:9px;padding:10px 16px;font-size:13.5px;max-width:520px;
  box-shadow:0 14px 40px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
}
.tut-toast.is-on{opacity:1;transform:translate(-50%,0)}

/* skip link */
.tut-skip{position:absolute;left:-9999px}
.tut-skip:focus{left:8px;top:8px;z-index:300;background:var(--t-accent);color:#1a1206;padding:8px 14px;border-radius:8px;font-weight:700}

/* ==========================================================================
   4. RESPONSIVE
   ========================================================================== */
@media (max-width:1180px){
  .tut-body{padding:28px 22px 110px}
  .tut-topbar{padding:12px 22px 0}
}
@media (max-width:1040px){
  :root{--rail-w:224px}
  .tut-compare{grid-template-columns:1fr}
  .hs-panel{width:360px}
}
@media (max-width:900px){
  .tut-app{grid-template-columns:1fr}
  .tut-rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--t-border)}
  .tut-modlist{display:grid;grid-template-columns:1fr 1fr}
  .hs-panel{
    top:auto;bottom:0;right:0;left:0;width:auto;max-width:none;height:76vh;
    border-left:0;border-top:1px solid var(--t-border-2);border-radius:14px 14px 0 0;
    transform:translateY(102%);
  }
}

/* ==========================================================================
   5. GITHUB REPLICA — everything below is scoped to .gh-root
   ========================================================================== */
.gh-root{
  background:var(--gh-canvas-default);color:var(--gh-fg-default);
  font-family:var(--font-sans);font-size:14px;line-height:1.5;
}
.gh-root *{box-sizing:border-box}
.gh-root a,.gh-link{color:var(--gh-accent-fg);text-decoration:none;cursor:pointer}
.gh-root a:hover,.gh-link:hover{text-decoration:underline}
.gh-muted{color:var(--gh-fg-muted)}
.gh-subtle{color:var(--gh-fg-subtle)}
.gh-mono{font-family:var(--font-mono);font-size:12px}
.gh-b{font-weight:600}
.octicon{width:16px;height:16px;fill:currentColor;display:inline-block;vertical-align:text-bottom;flex:0 0 auto}
.octicon--sm{width:12px;height:12px}
.octicon--lg{width:24px;height:24px}

/* --- avatars (drawn, never loaded) --- */
.gh-avatar{
  width:20px;height:20px;border-radius:50%;display:inline-block;vertical-align:middle;
  background:#30363d;overflow:hidden;flex:0 0 auto;border:1px solid rgba(240,246,252,.08);
}

.gh-avatar--sq{border-radius:6px}
.gh-avatar--16{width:16px;height:16px}
.gh-avatar--24{width:24px;height:24px}
.gh-avatar--32{width:32px;height:32px}
.gh-avatar--40{width:40px;height:40px}
.gh-avatar--48{width:48px;height:48px}

/* --- buttons --- */
.gh-btn{
  display:inline-flex;align-items:center;gap:6px;padding:5px 16px;border-radius:6px;
  font-size:12px;font-weight:600;line-height:20px;cursor:pointer;white-space:nowrap;
  background:var(--gh-btn-bg);border:1px solid var(--gh-border-default);color:var(--gh-fg-default);
  text-decoration:none;
}
.gh-btn:hover{background:var(--gh-btn-hover);border-color:#8b949e;text-decoration:none}
.gh-btn .octicon{color:var(--gh-fg-muted)}
.gh-btn--primary{background:var(--gh-btn-primary-bg);border-color:rgba(240,246,252,.1);color:#fff}
.gh-btn--primary:hover{background:var(--gh-btn-primary-hover);border-color:rgba(240,246,252,.1)}
.gh-btn--primary .octicon{color:#fff}
.gh-btn--danger{background:var(--gh-btn-bg);border-color:var(--gh-border-default);color:var(--gh-danger-fg)}
.gh-btn--danger:hover{background:#da3633;border-color:#f85149;color:#fff}
.gh-btn--danger:hover .octicon{color:#fff}
.gh-btn--invisible{background:transparent;border-color:transparent;color:var(--gh-fg-muted)}
.gh-btn--invisible:hover{background:var(--gh-btn-bg);border-color:transparent;color:var(--gh-fg-default)}
.gh-btn--sm{padding:3px 12px;font-size:12px}
.gh-btn--icon{padding:5px 8px}
.gh-btn--block{width:100%;justify-content:center}

.gh-btngroup{display:inline-flex;align-items:stretch}
.gh-btngroup .gh-btn{border-radius:0;margin-left:-1px}
.gh-btngroup>*:first-child .gh-btn,.gh-btngroup>.gh-btn:first-child{border-radius:6px 0 0 6px;margin-left:0}
.gh-btngroup>*:last-child .gh-btn,.gh-btngroup>.gh-btn:last-child{border-radius:0 6px 6px 0}
.gh-btngroup .gh-btn--solo{border-radius:6px}
.gh-split{display:inline-flex}
.gh-split .gh-btn:first-child{border-radius:6px 0 0 6px}
.gh-split .gh-btn:last-child{border-radius:0 6px 6px 0;margin-left:-1px;padding-left:8px;padding-right:8px}

.gh-counter{
  display:inline-block;min-width:20px;padding:0 6px;border-radius:20px;
  background:var(--gh-btn-bg);border:1px solid var(--gh-border-default);
  font-size:12px;font-weight:600;line-height:18px;text-align:center;color:var(--gh-fg-default);
}
.gh-counter--flat{background:rgba(110,118,129,.4);border-color:transparent}

/* --- badges / labels / pills --- */
.gh-badge{
  display:inline-block;padding:0 7px;border-radius:2em;border:1px solid var(--gh-border-default);
  font-size:12px;font-weight:500;line-height:18px;color:var(--gh-fg-muted);white-space:nowrap;
}
.gh-badge--private{}
.gh-badge--public{}
.gh-label{
  display:inline-flex;align-items:center;gap:4px;padding:0 10px;border-radius:2em;
  font-size:12px;font-weight:600;line-height:22px;border:1px solid transparent;white-space:nowrap;
}
.gh-state{
  display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:2em;
  font-size:12px;font-weight:600;color:#fff;white-space:nowrap;
}
.gh-state--open{background:var(--gh-btn-primary-bg)}
.gh-state--closed{background:#8957e5}
.gh-state--merged{background:#8957e5}
.gh-state--closed-issue{background:#8957e5}
.gh-state--notplanned{background:var(--gh-neutral-emphasis)}
.gh-state--draft{background:var(--gh-neutral-emphasis)}
.gh-state--sm{padding:2px 8px;font-size:11px}

/* --- inputs / menus --- */
.gh-input{
  background:var(--gh-canvas-default);border:1px solid var(--gh-border-default);border-radius:6px;
  color:var(--gh-fg-default);font-size:14px;padding:5px 12px;font-family:inherit;width:100%;
  line-height:20px;
}
.gh-input::placeholder{color:var(--gh-fg-subtle)}
.gh-input:focus{outline:none;border-color:var(--gh-accent-emphasis);box-shadow:0 0 0 1px var(--gh-accent-emphasis)}
.gh-input--sm{padding:3px 12px;font-size:12px}

.gh-menuwrap{position:relative;display:inline-block}
.gh-menu{
  position:absolute;top:calc(100% + 6px);left:0;z-index:30;min-width:260px;display:none;
  background:var(--gh-canvas-overlay);border:1px solid var(--gh-border-default);border-radius:6px;
  box-shadow:0 8px 24px rgba(1,4,9,.75);overflow:hidden;
}
.gh-menu.is-open{display:block}
.gh-menu--right{left:auto;right:0}
.gh-menu--wide{min-width:340px}
.gh-menu__hd{
  padding:8px 12px;border-bottom:1px solid var(--gh-border-muted);font-size:12px;font-weight:600;
  background:var(--gh-canvas-subtle);
}
.gh-menu__item{
  display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:14px;cursor:pointer;
  border-bottom:1px solid var(--gh-border-muted);color:var(--gh-fg-default);
}
.gh-menu__item:last-child{border-bottom:0}
.gh-menu__item:hover{background:var(--gh-accent-emphasis);color:#fff;text-decoration:none}
.gh-menu__item:hover .octicon,.gh-menu__item:hover .gh-muted{color:#fff}
.gh-menu__item .octicon{color:var(--gh-fg-muted)}
.gh-menu__item small{display:block;color:var(--gh-fg-muted);font-size:12px}
.gh-menu__sec{padding:6px 12px;font-size:12px;font-weight:600;color:var(--gh-fg-muted);background:var(--gh-canvas-subtle);border-bottom:1px solid var(--gh-border-muted)}

/* --- flash / banner --- */
.gh-flash{
  border:1px solid var(--gh-accent-emphasis);background:rgba(56,139,253,.1);border-radius:6px;
  padding:12px 16px;font-size:14px;display:flex;gap:10px;align-items:flex-start;margin-bottom:16px;
}
.gh-flash .octicon{margin-top:2px;color:var(--gh-accent-fg)}
.gh-flash--warn{border-color:rgba(187,128,9,.4);background:rgba(187,128,9,.15)}
.gh-flash--warn .octicon{color:var(--gh-attention-fg)}
.gh-flash--danger{border-color:rgba(248,81,73,.4);background:rgba(248,81,73,.1)}
.gh-flash--danger .octicon{color:var(--gh-danger-fg)}
.gh-flash--success{border-color:rgba(63,185,80,.4);background:rgba(63,185,80,.1)}
.gh-flash--success .octicon{color:var(--gh-success-fg)}

/* --- empty state / blankslate --- */
.gh-blankslate{
  padding:48px 24px;text-align:center;border:1px solid var(--gh-border-default);border-radius:6px;
  background:var(--gh-canvas-default);
}
.gh-blankslate .octicon{width:24px;height:24px;color:var(--gh-fg-muted);margin-bottom:10px}
.gh-blankslate h3{margin:0 0 6px;font-size:16px;font-weight:600}
.gh-blankslate p{margin:0 0 16px;color:var(--gh-fg-muted);font-size:14px}
.gh-blankslate--dashed{border-style:dashed}

/* ==========================================================================
   5a. GLOBAL TOP NAV
   ========================================================================== */
.gh-topnav{
  background:var(--gh-canvas-inset);border-bottom:1px solid var(--gh-border-default);
  padding:8px 16px;display:flex;align-items:center;gap:12px;
}

  background:none;border:0;color:var(--gh-fg-default);padding:4px;cursor:pointer;display:grid;place-items:center;
  border-radius:6px;
}
.gh-topnav__hamburger:hover{background:rgba(177,186,196,.12)}
.gh-topnav__mark{color:var(--gh-fg-default);display:grid;place-items:center}

.gh-searchbox{
  display:flex;align-items:center;gap:8px;background:var(--gh-canvas-default);
  border:1px solid var(--gh-border-default);border-radius:6px;padding:3px 8px;

}

.gh-searchbox .octicon{color:var(--gh-fg-muted)}
.gh-searchbox__ph{flex:1;color:var(--gh-fg-subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gh-searchbox__slash{
  border:1px solid var(--gh-border-default);border-radius:4px;padding:0 5px;font-size:12px;
  line-height:18px;color:var(--gh-fg-subtle);font-family:var(--font-mono);
}
.gh-topnav__actions{display:flex;align-items:center;gap:4px}
.gh-navbtn{
  display:inline-flex;align-items:center;gap:3px;padding:5px 7px;border-radius:6px;cursor:pointer;
  color:var(--gh-fg-default);border:1px solid transparent;background:none;position:relative;
}
.gh-navbtn:hover{background:rgba(177,186,196,.12)}
.gh-navbtn--bordered{border-color:var(--gh-border-default)}
.gh-navbtn .octicon{color:var(--gh-fg-default)}
.gh-navbtn__dot{
  position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%;
  background:var(--gh-accent-fg);border:2px solid var(--gh-canvas-inset);
}
.gh-topnav__avatar{margin-left:4px;cursor:pointer}

/* ==========================================================================

.gh-repohead{padding:16px 16px 0;background:var(--gh-canvas-default)}
.gh-repohead__row{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.gh-breadcrumb{display:flex;align-items:center;gap:8px;font-size:20px;line-height:1.25;min-width:0;flex-wrap:wrap}
.gh-breadcrumb .octicon{color:var(--gh-fg-muted);width:16px;height:16px}
.gh-breadcrumb__owner{color:var(--gh-accent-fg);font-weight:400;cursor:pointer}
.gh-breadcrumb__owner:hover{text-decoration:underline}
.gh-breadcrumb__sep{color:var(--gh-fg-muted);font-weight:300}
.gh-breadcrumb__repo{color:var(--gh-accent-fg);font-weight:600;cursor:pointer}
.gh-breadcrumb__repo:hover{text-decoration:underline}
.gh-breadcrumb__cur{color:var(--gh-fg-default);font-weight:600}
.gh-repohead__actions{margin-left:auto;display:flex;align-items:center;gap:8px;padding-top:2px}

.gh-tabnav{
  padding:0 12px;border-bottom:1px solid var(--gh-border-default);margin-top:18px;
  display:flex;gap:1px;overflow-x:auto;scrollbar-width:none;
}

.gh-tab{
  display:inline-flex;align-items:center;gap:6px;padding:8px 7px 10px;font-size:13.5px;

  margin-bottom:-1px;border-radius:6px 6px 0 0;

.gh-page{padding:26px 28px 32px}
.gh-layout{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:24px;align-items:start}
.gh-layout--narrow{grid-template-columns:minmax(0,1fr) 256px}
.gh-layout--full{grid-template-columns:minmax(0,1fr)}

/* branch/tag toolbar row */
.gh-repotoolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.gh-branchsel{
  display:inline-flex;align-items:center;gap:6px;background:var(--gh-btn-bg);

.gh-toolbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.gh-gotofile{

  border:1px solid var(--gh-border-default);border-radius:6px;padding:3px 10px;
  font-size:14px;color:var(--gh-fg-subtle);width:190px;min-width:120px;cursor:text;
}
.gh-gotofile:hover{border-color:var(--gh-fg-subtle)}
.gh-gotofile .octicon{color:var(--gh-fg-muted)}
.gh-gotofile__slash{
  margin-left:auto;border:1px solid var(--gh-border-default);border-radius:4px;padding:0 5px;
  font-size:12px;line-height:17px;color:var(--gh-fg-subtle);font-family:var(--font-mono);
}

/* ==========================================================================
   5d. FILE LIST BOX

.gh-filebox{border:1px solid var(--gh-border-default);border-radius:6px;overflow:visible;background:var(--gh-canvas-default)}

  display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--gh-canvas-subtle);
  border-bottom:1px solid var(--gh-border-default);border-radius:6px 6px 0 0;font-size:14px;
}

.gh-commitmsg{color:var(--gh-fg-default);cursor:pointer;flex:1 1 auto;min-width:40px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gh-commitmsg:hover{color:var(--gh-accent-fg);text-decoration:underline}
.gh-commitauthor{font-weight:600;cursor:pointer;white-space:nowrap}
.gh-commitauthor:hover{text-decoration:underline}
.gh-commitmeta{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--gh-fg-muted);font-size:12px;white-space:nowrap}
.gh-sha{font-family:var(--font-mono);font-size:12px;color:var(--gh-fg-muted);cursor:pointer}

.gh-copybtn{
  background:none;border:0;color:var(--gh-fg-muted);cursor:pointer;padding:2px;border-radius:4px;display:grid;place-items:center;
}

.gh-commitcount{display:inline-flex;align-items:center;gap:6px;color:var(--gh-fg-muted);cursor:pointer}

.gh-filerow{

  border-top:1px solid var(--gh-border-muted);cursor:pointer;
}

.gh-filerow__icon{color:var(--gh-fg-muted);width:16px;height:16px;flex:0 0 16px}

}
.gh-filerow:hover .gh-filerow__name{color:var(--gh-accent-fg);text-decoration:underline}
.gh-filerow__msg{
  color:var(--gh-fg-muted);font-size:14px;flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;padding-left:8px;
}
.gh-filerow__msg:hover{color:var(--gh-accent-fg);text-decoration:underline}
.gh-filerow__time{color:var(--gh-fg-muted);font-size:12px;white-space:nowrap;margin-left:auto;padding-left:12px}

/* ==========================================================================
   5e. README / MARKDOWN
   ========================================================================== */
.gh-readmebox{border:1px solid var(--gh-border-default);border-radius:6px;margin-top:16px;background:var(--gh-canvas-default)}

.gh-markdown{font-size:16px;line-height:1.5;color:var(--gh-fg-default);word-wrap:break-word}
.gh-markdown>*:first-child{margin-top:0}
.gh-markdown>*:last-child{margin-bottom:0}
.gh-markdown h1{
  font-size:32px;font-weight:600;margin:24px 0 16px;padding-bottom:.3em;line-height:1.25;
  border-bottom:1px solid var(--gh-border-muted);
}

  font-size:24px;font-weight:600;margin:24px 0 16px;padding-bottom:.3em;line-height:1.25;

}

.gh-markdown h4{font-size:16px;font-weight:600;margin:24px 0 16px}
.gh-markdown p{margin:0 0 16px}
.gh-markdown ul,.gh-markdown ol{margin:0 0 16px;padding-left:2em}

.gh-markdown blockquote{

}
.gh-markdown code{
  font-family:var(--font-mono);font-size:85%;background:rgba(110,118,129,.4);
  border-radius:6px;padding:.2em .4em;
}
.gh-markdown pre{
  background:var(--gh-canvas-subtle);border-radius:6px;padding:16px;overflow:auto;

}
.gh-markdown pre code{background:none;padding:0;font-size:100%}
.gh-markdown table{border-collapse:collapse;margin:0 0 16px;display:block;width:max-content;max-width:100%;overflow:auto}
.gh-markdown th,.gh-markdown td{border:1px solid var(--gh-border-default);padding:6px 13px}
.gh-markdown th{background:var(--gh-canvas-subtle);font-weight:600}
.gh-markdown tr:nth-child(2n) td{background:var(--gh-canvas-subtle)}
.gh-markdown hr{height:.25em;padding:0;margin:24px 0;background:var(--gh-border-default);border:0}
.gh-markdown a{color:var(--gh-accent-fg);text-decoration:none}
.gh-markdown a:hover{text-decoration:underline}
.gh-markdown img{max-width:100%}

/* ==========================================================================
   5f. RIGHT SIDEBAR CARDS

.gh-toprepos{display:flex;flex-direction:column;gap:2px;padding:0 8px 12px;max-height:340px;overflow-y:auto}
.gh-toprepo{
  display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;font-size:14px;
  color:var(--gh-accent-fg);cursor:pointer;
}
.gh-toprepo:hover{background:var(--gh-canvas-subtle);text-decoration:none}
.gh-toprepo:hover span{text-decoration:underline}
.gh-toprepo .gh-avatar{flex:0 0 16px}
.gh-toprepo span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gh-feeditem{border:1px solid var(--gh-border-default);border-radius:6px;margin-bottom:16px;background:var(--gh-canvas-default)}
.gh-feeditem__hd{display:flex;align-items:center;gap:8px;padding:12px 16px;font-size:14px;color:var(--gh-fg-muted);border-bottom:1px solid var(--gh-border-muted)}
.gh-feeditem__hd b{color:var(--gh-fg-default)}
.gh-feeditem__bd{padding:16px}
.gh-feedrepo{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;color:var(--gh-accent-fg);margin-bottom:4px}
.gh-feeditem__desc{font-size:14px;color:var(--gh-fg-muted);margin:0 0 12px}
.gh-feeditem__meta{display:flex;gap:16px;font-size:12px;color:var(--gh-fg-muted);align-items:center;flex-wrap:wrap}
.gh-changelog__item{padding:8px 0;border-bottom:1px solid var(--gh-border-muted);font-size:14px}
.gh-changelog__item:last-child{border-bottom:0}
.gh-changelog__item a,.gh-changelog__item .gh-link{display:block;margin-bottom:2px}
.gh-changelog__date{font-size:12px;color:var(--gh-fg-muted)}

/* deliberately inert affordance */
.gh-root [data-inert]{cursor:not-allowed}

/* ==========================================================================
   5o. CONTAINER QUERIES — these govern the replica's own responsiveness.
   They key off the width of .ghframe__body, so a screen laid out inside a
   930px frame behaves like GitHub does in a 930px browser window.
   ========================================================================== */
@container ghscreen (max-width:1010px){
  .gh-dash{grid-template-columns:minmax(0,232px) minmax(0,1fr) minmax(0,248px);gap:16px;padding:20px 16px}
  .gh-dash__right{display:block}
}
@container ghscreen (max-width:940px){
  .gh-layout{grid-template-columns:minmax(0,1fr) 272px;gap:20px}
}
@container ghscreen (max-width:900px){
  /* GitHub drops Watch/Fork/Star onto their own row when the header gets tight */
  .gh-repohead__actions{margin-left:0;width:100%;padding-top:10px}
}
@container ghscreen (max-width:820px){
  .gh-dash{grid-template-columns:minmax(0,232px) minmax(0,1fr)}
  .gh-dash__right{display:none}
  .gh-searchpage{grid-template-columns:180px minmax(0,1fr)}
}
@container ghscreen (max-width:700px){
  .gh-layout{grid-template-columns:minmax(0,1fr)}
  .gh-dash{grid-template-columns:minmax(0,1fr)}
  .gh-settings{grid-template-columns:minmax(0,1fr)}
  .gh-searchpage{grid-template-columns:minmax(0,1fr)}
  .gh-page{padding:20px 16px 24px}
  .gh-repohead{padding:12px 12px 0}
}
</style>

   TUTORIAL ENGINE — vanilla, no build step, runs from file://
   Content agents never need to read this. The schema is documented at the
   top of build/modules/02-repo-anatomy.js.
   ========================================================================== */
var MODULES = [];

(function(){
"use strict";

/* The canonical 10 modules. The rail always shows all ten; ones that have not
   been written yet render as "coming soon" instead of vanishing. */
var MODULE_INDEX = [
  {num:1,  id:'what-is-github',        title:'What Git and GitHub actually are'},
  {num:2,  id:'repo-anatomy',          title:'Anatomy of a repository page'},
  {num:3,  id:'files-and-readme',      title:'Files, READMEs and making your first change'},
  {num:4,  id:'commits-and-history',   title:'Commits: the save points that never disappear'},
  {num:5,  id:'branches',              title:'Branches: working without breaking anything'},
  {num:6,  id:'pull-requests',         title:'Pull requests: how changes get discussed and merged'},
  {num:7,  id:'issues',                title:'Issues: the to-do list that lives with the project'},
  {num:8,  id:'search-and-discovery',  title:'Finding things: search, the dashboard, other people’s code'},
  {num:9,  id:'settings-and-visibility',title:'Settings, visibility and not leaking things'},
  {num:10, id:'beyond-uni',            title:'What GitHub is actually capable of (beyond this unit)'}
];

var STORE_KEY = 'gh-tutorial-progress-v1';
var state = {
  current: null,        // module id
  screens: [],          // live screen controllers on the page
  activeScreen: null,   // screen controller keyboard arrows drive
  panelMode: null,      // 'hotspot' | 'event'
  done: {}
};

/* ---------- tiny helpers ---------- */
function $(sel, root){ return (root||document).querySelector(sel); }
function $$(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function el(html){
  var t = document.createElement('template');
  t.innerHTML = String(html).trim();
  return t.content.firstElementChild;
}
function frag(html){
  var t = document.createElement('template');
  t.innerHTML = String(html);
  return t.content;
}
function icon(name, cls){
  return '<svg class="octicon' + (cls ? ' ' + cls : '') + '" aria-hidden="true"><use href="#oct-' + name + '"/></svg>';
}
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function loadProgress(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; }catch(e){ return {}; }
}
function saveProgress(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state.done)); }catch(e){}
}

/* ---------- toast ---------- */
var toastEl, toastTimer;
function toast(msg){
  if(!toastEl) toastEl = $('#tut-toast');
  toastEl.innerHTML = msg;
  toastEl.classList.add('is-on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove('is-on'); }, 3800);
}

/* ---------- drawn avatars (no image files, ever) ----------
   Any element with class .gh-avatar and a data-user attribute gets a
   deterministic GitHub-ish identicon painted into it. */
function hashStr(s){
  var h = 5381;
  for(var i=0;i<s.length;i++){ h = ((h<<5)+h) + s.charCodeAt(i); h |= 0; }
  return Math.abs(h);
}
function paintAvatars(root){
  $$('.gh-avatar[data-user]', root).forEach(function(node){
    if(node.dataset.painted) return;
    node.dataset.painted = '1';
    var seed = hashStr(node.dataset.user || '?');
    var hue = seed % 360;
    var fg = 'hsl(' + hue + ',62%,58%)';
    var bg = 'hsl(' + hue + ',22%,17%)';
    var cells = '';
    for(var x=0;x<3;x++){
      for(var y=0;y<5;y++){
        var on = ((seed >> (x*5 + y)) & 1) === 1;
        if(!on) continue;
        cells += '<rect x="'+x+'" y="'+y+'" width="1" height="1"/>';
        if(x<2) cells += '<rect x="'+(4-x)+'" y="'+y+'" width="1" height="1"/>';
      }
    }
    node.innerHTML =
      '<svg viewBox="0 0 5 5" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
      '<rect width="5" height="5" fill="'+bg+'"/><g fill="'+fg+'">'+cells+'</g></svg>';
    if(!node.getAttribute('title')) node.setAttribute('title', node.dataset.user);
  });
}

/* ==========================================================================
   SECTION RENDERERS
   Each returns a DOM node. Add a type here and document it in the schema
   comment of build/modules/02-repo-anatomy.js.
   ========================================================================== */
var RENDERERS = {

  prose: function(s){
    var n = el('<section class="tut-sec tut-prose"></section>');
    if(s.title) n.appendChild(el('<h2>' + s.title + '</h2>'));
    n.appendChild(frag(s.html || ''));
    return n;
  },

  callout: function(s){
    var v = s.variant || 'info';
    var icons = {info:'info', tip:'light-bulb', warn:'alert', danger:'x', moment:'search'};
    var n = el('<section class="tut-sec tut-callout tut-callout--' + v + '"></section>');
    var head = '<div class="tut-callout__ttl">' + icon(icons[v] || 'info') +
               '<span>' + (s.title || '') + '</span>' +
               (v === 'moment' ? '<span class="tut-callout__tag">In your repo</span>' : '') +
               '</div>';
    n.appendChild(frag(head));
    n.appendChild(frag(s.html || ''));
    return n;
  },

  steps: function(s){
    var n = el('<section class="tut-sec tut-steps"></section>');
    if(s.title) n.appendChild(el('<h2>' + s.title + '</h2>'));
    var ol = el('<ol></ol>');
    (s.items || []).forEach(function(it){
      ol.appendChild(el(
        '<li><span class="tut-steps__lbl">' + (it.label || '') + '</span>' +
        '<div class="tut-steps__body">' + (it.html || '') + '</div></li>'
      ));
    });
    n.appendChild(ol);
    return n;
  },

  compare: function(s){
    var n = el('<section class="tut-sec tut-compare"></section>');
    if(s.title) n.appendChild(el('<h2>' + s.title + '</h2>'));
    var L = s.left || {}, R = s.right || {};
    n.appendChild(el(
      '<div class="tut-cmp tut-cmp--bad"><div class="tut-cmp__hd">' + icon('x') +
      (L.title || 'What goes wrong') + '</div><div class="tut-cmp__bd">' + (L.html || '') + '</div></div>'
    ));
    n.appendChild(el(
      '<div class="tut-cmp tut-cmp--good"><div class="tut-cmp__hd">' + icon('check') +
      (R.title || 'What to do instead') + '</div><div class="tut-cmp__bd">' + (R.html || '') + '</div></div>'
    ));
    return n;
  },

  terms: function(s){
    var n = el('<section class="tut-sec tut-terms"></section>');
    if(s.title) n.appendChild(el('<h2>' + s.title + '</h2>'));
    var dl = el('<dl></dl>');
    (s.items || []).forEach(function(it){
      dl.appendChild(el('<dt>' + (it.term || '') + '</dt>'));
      dl.appendChild(el('<dd>' + (it.html || '') + '</dd>'));
    });
    n.appendChild(dl);
    return n;
  },

  recap: function(s){
    var n = el('<section class="tut-sec tut-recap"></section>');
    n.appendChild(el('<h2>' + icon('check-circle') + (s.title || 'What you now know') + '</h2>'));
    var ul = el('<ul></ul>');
    (s.items || []).forEach(function(it){
      ul.appendChild(el('<li>' + icon('check') + '<span>' + it + '</span></li>'));
    });
    n.appendChild(ul);
    return n;
  },

  html: function(s){
    var n = el('<section class="tut-sec tut-prose"></section>');
    n.appendChild(frag(s.html || ''));
    return n;
  },

  screen: function(s){ return buildScreen(s); }
};

/* ==========================================================================
   FAKE-GITHUB SCREEN CONTROLLER
   ========================================================================== */
function formatUrl(u){
  var s = String(u || 'github.com').replace(/^https?:\/\//,'');
  var parts = s.split('/');
  var host = parts.shift();
  var out = '<span class="u-dim">https://</span>' + host;
  if(parts.length){
    var owner = parts.shift();
    out += '/<b>' + owner + '</b>';
    if(parts.length){
      var repo = parts.shift();
      out += '/<b>' + repo + '</b>';
      if(parts.length) out += '/' + parts.join('/');
    }
  }
  return out;
}

function buildScreen(spec){
  var viewNames = Object.keys(spec.views || {});
  if(!viewNames.length) viewNames = ['main'];
  var initial = spec.initial || viewNames[0];
  var hotspots = (spec.hotspots || []).map(function(h, i){
    return {
      n: i + 1,
      sel: h.sel,
      view: h.view || initial,
      place: h.place || 'left',
      title: h.title || 'This element',
      what: h.what, why: h.why, how: h.how, fail: h.fail, when: h.when,
      note: h.note,
      seen: false
    };
  });

  var fig = el('<figure class="ghframe" data-screen="' + esc(spec.id || 'screen') + '"></figure>');

  /* caption */
  var cap = el('<figcaption class="ghframe__cap"></figcaption>');
  cap.appendChild(frag(
    '<span class="ghframe__chip">' + icon('play') + 'Interactive replica — safe to click</span>' +
    '<span class="ghframe__label">' + (spec.label || '') + '</span>'
  ));
  var tools = el('<span class="ghframe__tools"></span>');
  if(hotspots.length){
    tools.appendChild(el('<span class="ghframe__count"></span>'));
    tools.appendChild(el('<button class="tut-btn tut-btn--accent" type="button" data-role="walk">' +
      icon('play') + ' Walk me through it</button>'));
  }
  tools.appendChild(el('<button class="tut-btn" type="button" data-role="reset">' + icon('sync') + ' Reset</button>'));
  cap.appendChild(tools);
  fig.appendChild(cap);

  /* browser chrome + body */
  var shell = el('<div class="ghframe__shell"></div>');
  var urlbar = el(
    '<div class="ghframe__urlbar">' +
      '<span class="ghframe__dots"><i></i><i></i><i></i></span>' +
      '<span class="ghframe__url">' + icon('lock') + '<span data-role="url"></span></span>' +
    '</div>'
  );
  shell.appendChild(urlbar);

  var body = el('<div class="ghframe__body gh-root"></div>');
  var originalHTML = {};
  viewNames.forEach(function(name){
    var v = spec.views[name];
    var html = (typeof v === 'string') ? v : (v && v.html) || '';
    originalHTML[name] = html;
    var wrap = el('<div class="gh-view" data-view="' + esc(name) + '"></div>');
    wrap.innerHTML = html;
    body.appendChild(wrap);
  });
  var layer = el('<div class="hs-layer"></div>');
  var spot = el('<div class="hs-spot"></div>');
  layer.appendChild(spot);
  body.appendChild(layer);
  shell.appendChild(body);
  fig.appendChild(shell);

  /* ---- controller ---- */
  var ctrl = {
    spec: spec, node: fig, body: body, layer: layer, spot: spot,
    hotspots: hotspots, view: initial, walkIdx: -1, markers: []
  };

  function urlFor(name){
    var v = spec.views[name];
    if(v && typeof v === 'object' && v.url) return v.url;
    return spec.url || 'github.com';
  }

  ctrl.setView = function(name, opts){
    if(!spec.views || !(name in spec.views)) return;
    ctrl.view = name;
    $$('.gh-view', body).forEach(function(v){
      v.style.display = (v.dataset.view === name) ? '' : 'none';
    });
    $('[data-role="url"]', urlbar).innerHTML = formatUrl(urlFor(name));
    closeMenus();
    buildMarkers();
    if(!opts || !opts.quiet) hidePanelSpot();
  };

  ctrl.reset = function(){
    $$('.gh-view', body).forEach(function(v){ v.innerHTML = originalHTML[v.dataset.view] || ''; });
    ctrl.hotspots.forEach(function(h){ h.seen = false; });
    ctrl.walkIdx = -1;
    paintAvatars(body);
    ctrl.setView(initial);
    updateCount();
    toast('Screen reset to how it started.');
  };

  function closeMenus(){ $$('.gh-menu.is-open', body).forEach(function(m){ m.classList.remove('is-open'); }); }

  function updateCount(){
    var c = $('.ghframe__count', fig);
    if(!c) return;
    var seen = ctrl.hotspots.filter(function(h){ return h.seen; }).length;
    c.textContent = seen + ' / ' + ctrl.hotspots.length + ' explained';
  }

  /* ---- hotspot markers ---- */
  function targetFor(h){
    var view = $('.gh-view[data-view="' + h.view + '"]', body);
    if(!view) return null;
    try { return view.querySelector(h.sel); } catch(e){ return null; }
  }

  function buildMarkers(){
    ctrl.markers.forEach(function(m){ m.node.remove(); });
    ctrl.markers = [];
    ctrl.hotspots.forEach(function(h){
      if(h.view !== ctrl.view) return;
      var btn = el('<button class="hs-marker" type="button" aria-label="Explain: ' +
        esc(h.title) + '">' + h.n + '</button>');
      btn.addEventListener('click', function(e){ e.stopPropagation(); openHotspot(ctrl, h); });
      btn.addEventListener('mouseenter', function(){ highlight(ctrl, h); });
      btn.addEventListener('focus', function(){ highlight(ctrl, h); });
      btn.addEventListener('mouseleave', function(){ if(state.panelMode !== 'hotspot') hidePanelSpot(); });
      layer.appendChild(btn);
      ctrl.markers.push({h:h, node:btn});
    });
    position();
  }

  function position(){
    var orect = layer.getBoundingClientRect();
    ctrl.markers.forEach(function(m){
      var t = targetFor(m.h);
      if(!t || !t.offsetParent && t.offsetWidth === 0){ m.node.style.display = 'none'; return; }
      var r = t.getBoundingClientRect();
      if(r.width === 0 && r.height === 0){ m.node.style.display = 'none'; return; }
      m.node.style.display = '';
      var S = 22, GAP = 8, x, y;
      var place = m.h.place;
      var relTop = r.top - orect.top, relLeft = r.left - orect.left;
      var narrow = r.width < orect.width * 0.5;
      /* Flip only when there is genuinely no room. A wide target (a full-width
         row) keeps its side and tucks into the page gutter instead — flipping
         it would fling the marker across the page, far from what it points at. */
      if(place === 'left'  && relLeft < S + 2 && narrow) place = 'right';
      if(place === 'right' && relLeft + r.width + S + 2 > orect.width && narrow) place = 'left';
      if(place === 'top'    && relTop < S + 2) place = 'bottom';
      if(place === 'bottom' && relTop + r.height + S + 2 > orect.height) place = 'top';
      switch(place){
        case 'right':  x = relLeft + r.width + GAP; y = relTop + r.height/2 - S/2; break;
        case 'top':    x = relLeft + r.width/2 - S/2; y = relTop - S - GAP; break;
        case 'bottom': x = relLeft + r.width/2 - S/2; y = relTop + r.height + GAP; break;
        default:       x = relLeft - S - GAP;        y = relTop + r.height/2 - S/2;
      }
      x = Math.max(2, Math.min(x, orect.width - S - 2));
      y = Math.max(2, Math.min(y, orect.height - S - 2));
      m.node.style.left = x + 'px';
      m.node.style.top  = y + 'px';
      m.x = x; m.y = y; m.rect = r; m.relTop = relTop; m.relLeft = relLeft;
      m.node.classList.toggle('is-seen', !!m.h.seen);
    });
    decollide(orect);
    if(ctrl.spotFor){
      var t2 = targetFor(ctrl.spotFor);
      if(t2){
        var r2 = t2.getBoundingClientRect();
        spot.style.left   = (r2.left - orect.left) + 'px';
        spot.style.top    = (r2.top - orect.top) + 'px';
        spot.style.width  = r2.width + 'px';
        spot.style.height = r2.height + 'px';
      }
    }
  }
  /* Two markers landing on the same spot is worse than either being slightly
     off, so nudge later ones sideways until they stop touching. */
  function decollide(orect){
    var S = 22, PAD = 4, placed = [];
    var live = ctrl.markers.filter(function(m){ return m.node.style.display !== 'none'; });
    live.sort(function(a,b){ return (a.y - b.y) || (a.x - b.x); });
    live.forEach(function(m){
      var x = m.x, y = m.y, tries = 0;
      function clashes(){
        for(var i=0;i<placed.length;i++){
          var p = placed[i];
          if(Math.abs(p.x - x) < S + PAD && Math.abs(p.y - y) < S + PAD) return true;
        }
        return false;
      }
      while(clashes() && tries < 14){
        /* step away from the target it belongs to, never over it */
        if(m.h.place === 'top' || m.h.place === 'bottom'){
          x += (x + S + PAD < orect.width - 2) ? (S + PAD) : -(S + PAD);
        } else {
          y += (y + S + PAD < orect.height - 2) ? (S + PAD) : -(S + PAD);
        }
        x = Math.max(2, Math.min(x, orect.width - S - 2));
        y = Math.max(2, Math.min(y, orect.height - S - 2));
        tries++;
      }
      m.x = x; m.y = y;
      m.node.style.left = x + 'px';
      m.node.style.top  = y + 'px';
      placed.push(m);
    });
  }

  ctrl.position = position;
  ctrl.buildMarkers = buildMarkers;

  ctrl.showSpot = function(h){
    ctrl.spotFor = h;
    position();
    spot.classList.add('is-on');
  };
  ctrl.hideSpot = function(){ ctrl.spotFor = null; spot.classList.remove('is-on'); };

  /* ---- declarative interactions ---- */
  var actions = (spec.actions || []).slice();
  var firedOnce = {};

  body.addEventListener('click', function(ev){
    if(ev.target.closest('.hs-marker')) return;
    var handled = false;
    for(var i=0;i<actions.length;i++){
      var a = actions[i];
      var hit = null;
      try { hit = ev.target.closest(a.on); } catch(e){ hit = null; }
      if(!hit || !body.contains(hit)) continue;
      if(a.once){ if(firedOnce[i]) { handled = true; continue; } firedOnce[i] = true; }
      runAction(a, hit);
      handled = true;
      if(a.stop !== false) break;
    }
    if(handled){ ev.preventDefault(); return; }

    /* menus close when you click elsewhere */
    if(!ev.target.closest('.gh-menu')) closeMenus();

    /* anything that LOOKS clickable but isn't wired says so out loud */
    var looksClickable = ev.target.closest(
      'a,button,.gh-btn,.gh-tab,.gh-filerow,.gh-menu__item,.gh-branchsel,.gh-refstat,' +
      '.gh-navbtn,.gh-searchbox,.gh-gotofile,.gh-metarow,.gh-sidelink,.gh-toprepo,' +
      '.gh-listrow,.gh-commitrow,.gh-facet,.gh-settings__navitem,[data-inert]'
    );
    if(looksClickable && body.contains(looksClickable)){
      ev.preventDefault();
      toast(spec.inertNote ||
        'That is a real GitHub control, but it is not wired up in this lesson. ' +
        'The numbered markers show what <em>is</em> live here.');
    }
  });

  function resolve(sel){
    var view = $('.gh-view[data-view="' + ctrl.view + '"]', body);
    var n = null;
    try{ n = (view && view.querySelector(sel)) || body.querySelector(sel); }catch(e){}
    return n;
  }

  function runAction(a, hit){
    if(a.view) ctrl.setView(a.view);
    if(a.toggle){
      var tg = resolve(a.toggle.target);
      if(tg){
        var cls = a.toggle.class || 'is-open';
        var willOpen = !tg.classList.contains(cls);
        if(cls === 'is-open') closeMenus();
        tg.classList.toggle(cls, willOpen);
      }
    }
    if(a.addClass){ var n1 = resolve(a.addClass.target); if(n1) n1.classList.add(a.addClass.class); }
    if(a.removeClass){ var n2 = resolve(a.removeClass.target); if(n2) n2.classList.remove(a.removeClass.class); }
    if(a.append){ var n3 = resolve(a.append.target); if(n3){ n3.appendChild(frag(a.append.html)); paintAvatars(n3); } }
    if(a.prepend){ var n4 = resolve(a.prepend.target); if(n4){ n4.insertBefore(frag(a.prepend.html), n4.firstChild); paintAvatars(n4); } }
    if(a.replace){ var n5 = resolve(a.replace.target); if(n5){ n5.innerHTML = a.replace.html; paintAvatars(n5); } }
    if(a.setText){ var n6 = resolve(a.setText.target); if(n6) n6.textContent = a.setText.text; }
    if(a.toast) toast(a.toast);
    if(a.explain) openEvent(ctrl, a.explain);
    schedule();
  }

  /* ---- caption tools ---- */
  cap.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-role]');
    if(!b) return;
    if(b.dataset.role === 'reset') ctrl.reset();
    if(b.dataset.role === 'walk'){ ctrl.walkIdx = -1; walkNext(ctrl); }
  });

  /* ---- keep markers glued to their targets ---- */
  var pending = false;
  function schedule(){
    if(pending) return;
    pending = true;
    requestAnimationFrame(function(){ pending = false; position(); });
  }
  ctrl.schedule = schedule;

  if(window.ResizeObserver){
    var ro = new ResizeObserver(schedule);
    ro.observe(body);
  }
  var mo = new MutationObserver(schedule);
  mo.observe(body, {childList:true, subtree:true, attributes:true, attributeFilter:['style','class']});

  fig.addEventListener('mouseenter', function(){ state.activeScreen = ctrl; });
  fig.addEventListener('focusin', function(){ state.activeScreen = ctrl; });

  /* init */
  paintAvatars(body);
  ctrl.setView(initial, {quiet:true});
  updateCount();
  ctrl.updateCount = updateCount;
  state.screens.push(ctrl);
  if(!state.activeScreen) state.activeScreen = ctrl;
  setTimeout(schedule, 60);
  setTimeout(schedule, 400);
  return fig;
}

/* ==========================================================================
   EXPLANATION PANEL (hotspots + "what just happened" events)
   ========================================================================== */
var panel, pNum, pTtl, pKick, pBd, pPos, pFt;
function panelInit(){
  panel = $('#hs-panel'); pNum = $('#hs-panel-num'); pTtl = $('#hs-panel-ttl');
  pKick = $('#hs-panel-kicker'); pBd = $('#hs-panel-bd'); pPos = $('#hs-panel-pos'); pFt = $('#hs-panel-ft');
  $('#hs-panel-close').addEventListener('click', closePanel);
  $('#hs-next').addEventListener('click', function(){ walkNext(state.activeScreen); });
  $('#hs-prev').addEventListener('click', function(){ walkPrev(state.activeScreen); });
}
function highlight(ctrl, h){ ctrl.showSpot(h); }
function hidePanelSpot(){ state.screens.forEach(function(c){ c.hideSpot(); }); }

var WHY_ROWS = [
  ['what', 'What this is',            'info'],
  ['why',  'Why it exists',           'light-bulb'],
  ['how',  'How you actually use it', 'code'],
  ['fail', 'What goes wrong',         'alert'],
  ['when', 'When you would reach for it', 'clock']
];

function openHotspot(ctrl, h){
  state.activeScreen = ctrl;
  state.panelMode = 'hotspot';
  h.seen = true;
  ctrl.walkIdx = ctrl.hotspots.indexOf(h);
  ctrl.updateCount();
  ctrl.showSpot(h);
  ctrl.markers.forEach(function(m){ m.node.classList.toggle('is-active', m.h === h); });
  var t = null;
  try{ t = $('.gh-view[data-view="' + h.view + '"] ' + h.sel, ctrl.body); }catch(e){}
  if(t && t.scrollIntoView) t.scrollIntoView({block:'center', behavior:'smooth'});

  pNum.textContent = h.n;
  pNum.classList.remove('is-event');
  pKick.textContent = 'Hotspot ' + h.n + ' of ' + ctrl.hotspots.length;
  pTtl.textContent = h.title;
  var html = '';
  WHY_ROWS.forEach(function(row){
    if(!h[row[0]]) return;
    html += '<div class="hs-row hs-row--' + row[0] + '">' +
            '<div class="hs-row__k">' + icon(row[2]) + row[1] + '</div>' +
            '<div class="hs-row__v">' + h[row[0]] + '</div></div>';
  });
  if(h.note) html += '<div class="tut-callout tut-callout--warn" style="margin-top:4px">' + h.note + '</div>';
  pBd.innerHTML = html;
  pBd.scrollTop = 0;
  pPos.textContent = h.n + ' / ' + ctrl.hotspots.length;
  pFt.style.display = '';
  showPanel();
  ctrl.schedule();
}

function openEvent(ctrl, ev){
  state.activeScreen = ctrl;
  state.panelMode = 'event';
  hidePanelSpot();
  if(ctrl.markers) ctrl.markers.forEach(function(m){ m.node.classList.remove('is-active'); });
  pNum.innerHTML = icon('check');
  pNum.classList.add('is-event');
  pKick.textContent = 'What just happened';
  pTtl.textContent = ev.title || 'What just happened';
  pBd.innerHTML = ev.html || '';
  pBd.scrollTop = 0;
  pFt.style.display = (ctrl.hotspots && ctrl.hotspots.length) ? '' : 'none';
  pPos.textContent = '';
  showPanel();
}

function showPanel(){ panel.classList.add('is-open'); panel.setAttribute('aria-hidden','false'); }
function closePanel(){
  panel.classList.remove('is-open');
  panel.setAttribute('aria-hidden','true');
  state.panelMode = null;
  hidePanelSpot();
  state.screens.forEach(function(c){
    (c.markers||[]).forEach(function(m){ m.node.classList.remove('is-active'); });
  });
}

function walkNext(ctrl){
  if(!ctrl || !ctrl.hotspots.length) return;
  var i = ctrl.walkIdx + 1;
  if(i >= ctrl.hotspots.length) i = 0;
  gotoHotspot(ctrl, i);
}
function walkPrev(ctrl){
  if(!ctrl || !ctrl.hotspots.length) return;
  var i = ctrl.walkIdx - 1;
  if(i < 0) i = ctrl.hotspots.length - 1;
  gotoHotspot(ctrl, i);
}
function gotoHotspot(ctrl, i){
  var h = ctrl.hotspots[i];
  if(h.view !== ctrl.view) ctrl.setView(h.view, {quiet:true});
  ctrl.walkIdx = i;
  openHotspot(ctrl, h);
}

/* ==========================================================================
   MODULE RENDERING + NAVIGATION
   ========================================================================== */
function moduleMap(){
  var m = {};
  MODULES.forEach(function(mod){ m[mod.id] = mod; });
  return m;
}
function loadedOrder(){
  var map = moduleMap();
  return MODULE_INDEX.filter(function(x){ return map[x.id]; }).map(function(x){ return x.id; });
}

function renderRail(){
  var map = moduleMap();
  var ul = $('#tut-modlist');
  ul.innerHTML = '';
  MODULE_INDEX.forEach(function(entry){
    var mod = map[entry.id];
    var li = document.createElement('li');
    var b = el(
      '<button class="tut-modlink" type="button" data-id="' + entry.id + '"' +
      (mod ? '' : ' disabled') + '>' +
        '<span class="tut-modnum">' + (state.done[entry.id] ? icon('check') : entry.num) + '</span>' +
        '<span><span class="tut-modttl">' + entry.title + '</span>' +
          (mod ? '' : '<br><span class="tut-modsoon">not written yet</span>') +
        '</span>' +
      '</button>'
    );
    if(state.done[entry.id]) b.classList.add('is-done');
    if(entry.id === state.current) b.setAttribute('aria-current','true');
    if(mod) b.addEventListener('click', function(){ go(entry.id); });
    li.appendChild(b);
    ul.appendChild(li);
  });
  var order = loadedOrder();
  var pct = order.length ? Math.round(Object.keys(state.done).length / MODULE_INDEX.length * 100) : 0;
  $('#tut-progress').style.width = pct + '%';
}

function renderModule(mod){
  var root = $('#tut-content');
  state.screens = [];
  state.activeScreen = null;
  closePanel();
  root.innerHTML = '';

  var head = el('<header class="tut-modhead"></header>');
  head.appendChild(el('<div class="tut-eyebrow">Module ' + mod.num + ' of 10</div>'));
  head.appendChild(el('<h1>' + mod.title + '</h1>'));
  if(mod.blurb) head.appendChild(el('<p class="tut-blurb">' + mod.blurb + '</p>'));
  if(mod.goals && mod.goals.length){
    var g = el('<div class="tut-goals"><h2>By the end of this module you will be able to</h2></div>');
    var ul = el('<ul></ul>');
    mod.goals.forEach(function(t){ ul.appendChild(el('<li>' + icon('check-circle') + '<span>' + t + '</span></li>')); });
    g.appendChild(ul);
    head.appendChild(g);
  }
  root.appendChild(head);

  (mod.sections || []).forEach(function(sec){
    var r = RENDERERS[sec.type];
    if(!r){
      root.appendChild(el('<section class="tut-sec tut-callout tut-callout--danger">' +
        '<div class="tut-callout__ttl">Unknown section type "' + esc(sec.type) + '"</div></section>'));
      return;
    }
    try { root.appendChild(r(sec)); }
    catch(e){
      root.appendChild(el('<section class="tut-sec tut-callout tut-callout--danger">' +
        '<div class="tut-callout__ttl">Section failed to render</div><p>' + esc(e.message) + '</p></section>'));
    }
  });

  paintAvatars(root);

  /* crumbs + prev/next */
  $('#tut-crumbs').innerHTML =
    'GitHub, Actually Explained &nbsp;/&nbsp; <b>' + mod.num + '. ' + mod.title + '</b>';
  var order = loadedOrder();
  var i = order.indexOf(mod.id);
  $('#tut-prev').disabled = (i <= 0);
  $('#tut-next').disabled = (i < 0 || i >= order.length - 1);

  state.done[mod.id] = true;
  saveProgress();
  renderRail();
  window.scrollTo(0, 0);
  root.focus({preventScroll:true});
  setTimeout(function(){ state.screens.forEach(function(c){ c.schedule(); }); }, 120);
}

function renderMissing(entry){
  var root = $('#tut-content');
  state.screens = [];
  root.innerHTML = '';
  root.appendChild(el(
    '<header class="tut-modhead"><div class="tut-eyebrow">Module ' + entry.num + ' of 10</div>' +
    '<h1>' + entry.title + '</h1>' +
    '<p class="tut-blurb">This module has not been written yet. Pick another one from the left.</p></header>'
  ));
  $('#tut-crumbs').innerHTML = 'GitHub, Actually Explained &nbsp;/&nbsp; <b>' + entry.title + '</b>';
}

function go(id, opts){
  var map = moduleMap();
  var entry = MODULE_INDEX.filter(function(e){ return e.id === id; })[0];
  state.current = id;
  if(map[id]) renderModule(map[id]);
  else if(entry) { renderMissing(entry); renderRail(); }
  if(!opts || !opts.silent){
    try { location.hash = 'm=' + id; } catch(e){}
  }
}

function readRoute(){
  var h = (location.hash || '').replace(/^#/,'');
  var m = /(?:^|&)m=([\w-]+)/.exec(h);
  if(m) return m[1];
  m = /[?&]m=([\w-]+)/.exec(location.search || '');
  if(m) return m[1];
  return null;
}

/* ==========================================================================
   KEYBOARD
   ========================================================================== */
function bindKeys(){
  document.addEventListener('keydown', function(e){
    if(e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if(e.key === 'Escape'){ closePanel(); return; }
    if(e.key === 'ArrowRight' && !e.metaKey && !e.ctrlKey && !e.altKey){
      if(state.activeScreen && state.activeScreen.hotspots.length){ e.preventDefault(); walkNext(state.activeScreen); }
    }
    if(e.key === 'ArrowLeft' && !e.metaKey && !e.ctrlKey && !e.altKey){
      if(state.activeScreen && state.activeScreen.hotspots.length){ e.preventDefault(); walkPrev(state.activeScreen); }
    }
  });
}

/* ==========================================================================
   BOOT
   ========================================================================== */
function boot(){
  state.done = loadProgress();
  panelInit();
  bindKeys();

  $('#tut-prev').addEventListener('click', function(){
    var order = loadedOrder(), i = order.indexOf(state.current);
    if(i > 0) go(order[i-1]);
  });
  $('#tut-next').addEventListener('click', function(){
    var order = loadedOrder(), i = order.indexOf(state.current);
    if(i > -1 && i < order.length - 1) go(order[i+1]);
  });

  window.addEventListener('hashchange', function(){
    var id = readRoute();
    if(id && id !== state.current) go(id, {silent:true});
  });
  window.addEventListener('resize', function(){
    state.screens.forEach(function(c){ c.schedule(); });
  });
  window.addEventListener('scroll', function(){
    if(state.panelMode === 'hotspot') state.screens.forEach(function(c){ c.schedule(); });
  }, {passive:true});

  MODULES.sort(function(a,b){ return (a.num||0) - (b.num||0); });
  renderRail();

  var want = readRoute();
  var order = loadedOrder();
  var start = (want && MODULE_INDEX.some(function(e){ return e.id === want; })) ? want : (order[0] || MODULE_INDEX[0].id);
  go(start, {silent:true});
}

/* public surface — the integration agent calls TUT.boot() after modules load */
window.TUT = {
  boot: boot,
  icon: icon,
  toast: toast,
  MODULE_INDEX: MODULE_INDEX,
  _state: state
};

})();
</script>
