              '<td class="gh-diff__ln" style="background:rgba(248,81,73,.15);color:var(--gh-fg-default)">3</td>' +
              '<td class="gh-diff__sign" style="background:var(--gh-diff-del);color:var(--gh-danger-fg)">-</td>' +
              '<td class="gh-diff__code" style="background:var(--gh-diff-del)">**Degree:** Economics (Finance), year 3<span class="gh-diffword-del"> *Trading alias:* e.g. IronCondor</span></td>' +
              '<td class="gh-diff__ln" style="background:rgba(63,185,80,.15);color:var(--gh-fg-default)">3</td>' +
              '<td class="gh-diff__sign" style="background:var(--gh-diff-add);color:var(--gh-success-fg)">+</td>' +
              '<td class="gh-diff__code" style="background:var(--gh-diff-add)">**Degree:** Economics (Finance), year 3</td></tr>' +
          '<tr data-h="d-add1">' +
              '<td class="gh-diff__ln">&nbsp;</td><td class="gh-diff__sign">&nbsp;</td><td class="gh-diff__code">&nbsp;</td>' +
              '<td class="gh-diff__ln" style="background:rgba(63,185,80,.15);color:var(--gh-fg-default)">4</td>' +
              '<td class="gh-diff__sign" style="background:var(--gh-diff-add);color:var(--gh-success-fg)">+</td>' +
              '<td class="gh-diff__code" style="background:var(--gh-diff-add)"><span class="gh-diffword-add">*Trading alias:* e.g. IronCondor</span></td></tr>' +
          '<tr><td class="gh-diff__ln">4</td><td class="gh-diff__sign">&nbsp;</td><td class="gh-diff__code">&nbsp;</td>' +
              '<td class="gh-diff__ln">5</td><td class="gh-diff__sign">&nbsp;</td><td class="gh-diff__code">&nbsp;</td></tr>' +
          '<tr><td class="gh-diff__ln">5</td><td class="gh-diff__sign">&nbsp;</td><td class="gh-diff__code">## Markets I want to trade this semester</td>' +
              '<td class="gh-diff__ln">6</td><td class="gh-diff__sign">&nbsp;</td><td class="gh-diff__code">## Markets I want to trade this semester</td></tr>' +
        '</tbody></table>'},
      explain:{title:'Same change, two ways of drawing it',
       html:'<p>Split view puts the old file in the left column and the new file in the right column, lined up row ' +
            'by row. Nothing about the commit changed — this is purely how the page draws it.</p>' +
            '<p>Split is easier when a line was <em>edited</em> and you want to see the before and after next to ' +
            'each other. Unified is easier when a lot was added or deleted outright, because you are not reading ' +
            'half-empty columns, and it is the only one that fits comfortably on a phone.</p>' +
            '<p>Most people pick one and stay there. Try both on a real change before you decide which one you are.</p>'}},

     {on:'[data-h="d-unified"]',
      addClass:{target:'[data-h="d-unified"]', class:'is-on'},
      removeClass:{target:'[data-h="d-split"]', class:'is-on'},
      replace:{target:'#diffbody', html:
        '<table class="gh-difftable"><tbody>' +
          '<tr class="gh-diffrow--hunk" data-h="d-hunk"><td class="gh-diff__ln">&nbsp;</td><td class="gh-diff__ln">&nbsp;</td><td class="gh-diff__sign">&nbsp;</td><td class="gh-diff__code">@@ -1,5 +1,6 @@</td></tr>' +
          '<tr><td class="gh-diff__ln">1</td><td class="gh-diff__ln">1</td><td class="gh-diff__sign">&nbsp;</td><td class="gh-diff__code"># Jordan Lee -- desk profile</td></tr>' +
          '<tr><td class="gh-diff__ln">2</td><td class="gh-diff__ln">2</td><td class="gh-diff__sign">&nbsp;</td><td class="gh-diff__code">&nbsp;</td></tr>' +
          '<tr class="gh-diffrow--del" data-h="d-del"><td class="gh-diff__ln">3</td><td class="gh-diff__ln">&nbsp;</td><td class="gh-diff__sign">-</td><td class="gh-diff__code">**Degree:** Economics (Finance), year 3<span class="gh-diffword-del"> *Trading alias:* e.g. IronCondor</span></td></tr>' +
          '<tr class="gh-diffrow--add" data-h="d-add1"><td class="gh-diff__ln">&nbsp;</td><td class="gh-diff__ln">3</td><td class="gh-diff__sign">+</td><td class="gh-diff__code">**Degree:** Economics (Finance), year 3</td></tr>' +
          '<tr class="gh-diffrow--add" data-h="d-add2"><td class="gh-diff__ln">&nbsp;</td><td class="gh-diff__ln">4</td><td class="gh-diff__sign">+</td><td class="gh-diff__code"><span class="gh-diffword-add">*Trading alias:* e.g. IronCondor</span></td></tr>' +
          '<tr><td class="gh-diff__ln">4</td><td class="gh-diff__ln">5</td><td class="gh-diff__sign">&nbsp;</td><td class="gh-diff__code">&nbsp;</td></tr>' +
          '<tr><td class="gh-diff__ln">5</td><td class="gh-diff__ln">6</td><td class="gh-diff__sign">&nbsp;</td><td class="gh-diff__code">## Markets I want to trade this semester</td></tr>' +
        '</tbody></table>'},
      toast:'Back to unified — one column, deletions above additions.'},

     {on:'[data-h="d-copysha"]', toast:'Copied <span style="font-family:var(--font-mono)">a4f21c8b93e7d2044f6c1ae58d3b90cc7e412a6f</span>. Paste that anywhere on GitHub and it turns into a link to this exact commit.'},
     {on:'[data-h="d-browsefiles"]', view:'browse', toast:'“Browse files” is the same time-travel button, taken from the commit’s own page.'},
     {on:'[data-h="back-history"]', view:'commits'},
     {on:'[data-h="hist-allbranches"]', toast:'Right now this shows the same five commits, because you have one branch. Module 5 changes that.'},
     {on:'[data-h="b-readme"]', toast:'That would open README.md as it was at <span style="font-family:var(--font-mono)">3c9d114</span> — before the formatting fix, with the degree and trading-alias text still on one line.'}
   ],

   /* ==================== HOTSPOTS ==================== */
   hotspots:[

    {sel:'[data-h="datehead"]', view:'commits', place:'left', title:'“Commits on Aug 7, 2026” — the date group',
     what:'<p>GitHub groups the history by calendar day, newest day first, and puts a header on each group. All five of your commits landed on the same afternoon, so you only get one header.</p>',
     why:'<p>A flat list of a thousand commits is unreadable. Days are the unit people actually think in — “what did we ship on Monday?” — so the list is chopped into days before you ever see it.</p>',
     how:'<p>Nothing to click. Read downwards: within a day the newest commit is at the top, and the days themselves run newest to oldest as you scroll.</p>',
     fail:'<p>Reading it upside down. This list is not chronological in the direction a diary is — the top row is the most recent thing that happened, not the first. Getting that backwards makes “when did it break?” unanswerable.</p>',
     when:'<p>Week 11, when you want to know what you did in the two days before a submission and can scroll straight to those date headers instead of reading every row.</p>'},

    {sel:'[data-h="rowavatar"]', view:'commits', place:'left', title:'The author avatar',
     what:'<p>The picture of the account that made the commit. Every commit is attributed to exactly one author, and GitHub draws their avatar at the start of the row.</p>',
     why:'<p>On any project with more than one person, “who did this?” is the first question and it needs answering without reading. A face on the left is faster than a username in the middle.</p>',
     how:'<p>Click an avatar to open that person’s profile and see everything else they have committed. On your repo it is you five times over.</p>',
     fail:'<p>The author is whoever the commit says it is, and on a repo you control that can be edited. On a shared project treat it as strong evidence, not proof — the <strong>Verified</strong> badge next to the SHA is the part that is cryptographically checked.</p>',
     when:'<p>A group assignment where the marker asks who contributed what. The avatars answer it in one scroll.</p>'},

    {sel:'[data-h="msg-bad"]', view:'commits', place:'left', title:'“Update journal\\week6.md” — a message that says nothing',
     what:'<p>The commit message. This one you did not write: when you edit a file on github.com and leave the message box alone, GitHub fills it in with <em>Update</em> plus the filename and commits that.</p>',
     why:'<p>Git refuses to record a commit with no message at all, because a change with no explanation is nearly useless later. GitHub’s autogenerated default exists so the web editor never blocks you — not because it is a good message.</p>',
     how:'<p>You cannot repair it now. What you do instead is type your own next time, in the box under the editor, before you press the green button. Module 3 covers the writing; this module is about the reading.</p>',
     fail:'<p>Here is the failure, concretely. In week 11 you scroll this list looking for the commit where your journal answers were still the good ones. Every row says “Update journal\\week6.md”. The list tells you a file changed twelve times and nothing about what any of those changes were, so you have to open all twelve diffs.</p>',
     when:'<p>Every single time you edit a file in the browser. The message box is two seconds of typing and it is the only part of a commit your future self actually reads.</p>'},

    {sel:'[data-h="msg-good"]', view:'commits', place:'left', title:'“Fix formatting in README for degree and trading alias” — a message that works',
     what:'<p>The same field, filled in by you. Verb first, then what, then where. Somebody who has never seen this repo knows what happened in that commit without opening it.</p>',
     why:'<p>The message is the index of the history. A diff tells you <em>what</em> changed; only the message can tell you <em>why</em>, and “why” is the thing you cannot reconstruct from the code six weeks later.</p>',
     how:'<p>Read a history top to bottom and see whether it reads as a story. Yours reads: started the repo, made a README, filled it in, tried to fix its formatting, updated the journal. Four of those five sentences are useful.</p>',
     fail:'<p>The message can also lie. This commit says the formatting was fixed. Open the diff (marker 12 onwards) and you will see it split one line into two source lines — which Markdown still renders as a single run-on line. The record is honest about what changed; only the sentence claims it worked.</p>',
     when:'<p>Whenever you are hunting for a specific past state. You search the messages first, and only open diffs when a message looks promising.</p>'},

    {sel:'[data-h="rowmeta"]', view:'commits', place:'bottom', title:'“committed 29 minutes ago” — relative time',
     what:'<p>How long ago the commit was recorded, phrased in human units. Hover the text on real GitHub and it turns into the exact timestamp, down to the minute and time zone.</p>',
     why:'<p>“29 minutes ago” answers “is this current?” instantly. An absolute date makes you do arithmetic. GitHub shows the useful one by default and hides the precise one behind a hover.</p>',
     how:'<p>Hover for the exact time. For anything you need to quote — a submission deadline, for instance — use the exact timestamp, not the relative one, because the relative one changes every time the page loads.</p>',
     fail:'<p>Relative times drift into vagueness fast. Everything older than a month collapses into “last month”, and “last year” could be fourteen months. If precision matters, hover.</p>',
     when:'<p>The moment a deadline is contested. “Committed 3 hours ago” proves nothing; the exact timestamp underneath it does, and it is recorded whether or not you thought to check.</p>'},

    {sel:'[data-h="shabox"]', view:'commits', place:'top', title:'109d091 — the commit ID, and why it looks like nonsense',
     what:'<p>The unique fingerprint of that one commit, shown as its first 7 characters. The real thing is 40 characters of hexadecimal — <code>109d091f4b2a8c6d3e07…</code> — and it is called a SHA, after the algorithm that produces it.</p>',
     why:'<p>Every save point needs a name that can never be reused or duplicated, including across computers that have never spoken to each other. Git generates the name <em>from the content of the commit itself</em>, so the same ID can never mean two different things — change one character anywhere and you get a completely different ID.</p>',
     how:'<p>GitHub shows 7 characters because that is comfortably enough to be unique in a repo this size, and 40 is unreadable. Anywhere GitHub accepts a SHA, the short form works.</p>',
     fail:'<p>Assuming it counts. <code>109d091</code> is not “commit 109”, and it tells you nothing about order — a commit made a second later gets an ID that could sort anywhere. Only the timestamps and the parent chain give you order.</p>',
     when:'<p>Emailing a tutor: “the version at <code>a4f21c8</code>” is exact and permanent. “The version from Tuesday afternoon” is not.</p>'},

    {sel:'[data-h="copy-109d091"]', view:'commits', place:'top', title:'The copy-SHA button',
     what:'<p>A one-click copy of the <strong>full 40-character</strong> ID onto your clipboard — not the 7 you can see. Click it and watch the toast.</p>',
     why:'<p>Nobody can transcribe 40 characters of hex without a mistake, and a single wrong character makes the ID point at nothing. The button exists because manual copying of this specific string has a near-100% error rate.</p>',
     how:'<p>Click the little copy icon in the grey box. Then paste it into a message, an issue comment, or the end of a GitHub URL. Pasted into any GitHub comment box, a bare SHA turns itself into a link to the commit.</p>',
     fail:'<p>Selecting the visible 7 characters with your mouse instead. That works inside this repo, but paste it into another tool — or a repo big enough for collisions — and it resolves to nothing, with a confusing error.</p>',
     when:'<p>Any time you need to say “this exact version” to another human, or to yourself in a note you will read after the exam.</p>'},

    {sel:'[data-h="browse-3c9d114"]', view:'commits', place:'right', title:'The &lt;&gt; button — browse the repo at this point in history',
     what:'<p>Opens the entire repository as it existed at that commit. Not the diff — the whole thing, files and README and all, frozen at that moment. Click it; the screen changes.</p>',
     why:'<p>A diff shows you one step. Sometimes you need the whole staircase: “what did the project look like before I started breaking it?” Rebuilding that by reading diffs backwards is miserable, so GitHub does the replay for you.</p>',
     how:'<p>Click the <code>&lt;&gt;</code> icon on any commit row. The URL becomes <code>/tree/&lt;sha&gt;</code>, and a warning bar appears telling you that you are in the past.</p>',
     fail:'<p>Forgetting you are there. The page looks almost identical to the normal repo, so people browse back in time, click the pencil to edit a file, and get confused when GitHub insists on putting their edit somewhere else. Check for the warning bar before you edit anything.</p>',
     when:'<p>“It worked on Tuesday.” Find Tuesday’s commit, click this, and read the working version with your own eyes instead of guessing what you changed.</p>'},

    {sel:'[data-h="verified"]', view:'commits', place:'left', title:'The “Verified” badge',
     what:'<p>A green badge saying GitHub can cryptographically prove this commit came from the account it claims to. Commits made through the website are always signed by GitHub, so all of yours have it.</p>',
     why:'<p>The author field in a commit is just text — anyone can put anybody’s name in it. Signing exists so that on public projects a claim of authorship can actually be checked rather than believed.</p>',
     how:'<p>Nothing to do here. Commits you make in the browser get this automatically. Commits made from your own laptop only get it if you set up a signing key, which is a later-life problem.</p>',
     fail:'<p>Treating <em>unverified</em> as suspicious. Most commits on GitHub are unverified and completely legitimate — it means unsigned, not forged. The badge is evidence when present, not an accusation when absent.</p>',
     when:'<p>Reviewing a contribution to a project that matters, where “did this really come from who it says?” is a question you are entitled to ask.</p>'},

    {sel:'[data-h="rootmeta"]', view:'commits', place:'bottom', title:'“Initial commit” — the bottom of the chain',
     what:'<p>The oldest commit in the repo, created automatically when you ticked “Add a README file” at repo-creation time. It is the only commit with no parent.</p>',
     why:'<p>The chain has to start somewhere. Every other commit points backwards at one before it; this one points at nothing, which is how Git knows it has reached the beginning.</p>',
     how:'<p>Scroll to the bottom of any history to find it. On someone else’s repo it tells you the true age of the project, which is often years older than the latest activity suggests.</p>',
     fail:'<p>It has no parent, so it has nothing to be compared against — its “diff” is just every line of every file it introduced, all green. That is normal and not a sign anything is wrong.</p>',
     when:'<p>Sizing up an unfamiliar library: first commit 2011, last commit 2019, and you now know both that it is mature and that it is abandoned.</p>'},

    {sel:'[data-h="hist-allbranches"]', view:'commits', place:'bottom', title:'The branch filter on the history',
     what:'<p>This history is not “everything that ever happened” — it is everything that happened on <code>main</code>. The picker to the left says which branch you are reading, and this button widens it to all of them.</p>',
     why:'<p>Once a repo has parallel branches, a single flat history would interleave unrelated work and become meaningless. The default is to show you the official line only.</p>',
     how:'<p>Change the branch in the picker to read a different line of history. Yours shows the same five commits either way, because you have exactly one branch.</p>',
     fail:'<p>Panicking because a commit you definitely made is not in the list. It almost certainly is — on a different branch. This filter is the single most common reason a commit appears to have vanished.</p>',
     when:'<p>Right after Module 5, the first time you commit to a branch and then wonder why <code>main</code>’s history looks untouched.</p>'},

    /* ---------- the diff view ---------- */
    {sel:'[data-h="d-title"]', view:'diff', place:'left', title:'The commit page: your message as the headline',
     what:'<p>One commit gets a whole page. Your message becomes the page heading, and everything underneath is the evidence for it.</p>',
     why:'<p>A commit is the smallest unit anyone reviews, argues about or reverts. Giving it its own URL means it can be linked to, quoted in an issue, and discussed in isolation.</p>',
     how:'<p>You reached this by clicking a row in the history. You can also reach it by pasting <code>/commit/a4f21c8</code> onto the end of any repo URL.</p>',
     fail:'<p>A message that describes the intention and a diff that shows something else — exactly what happened here. The heading claims the formatting was fixed; the diff below shows a change that Markdown ignores. Read both, always.</p>',
     when:'<p>Any time you want to send somebody one specific change rather than “go look at my repo”.</p>'},

    {sel:'[data-h="d-parent"]', view:'diff', place:'left', title:'“1 parent 7b0e5da” — the link backwards',
     what:'<p>The ID of the commit that came immediately before this one. That is the pointer that turns a pile of commits into a chain.</p>',
     why:'<p>A diff is meaningless without a “compared to what”. The parent <em>is</em> the “what” — everything red and green below is the difference between <code>7b0e5da</code> and <code>a4f21c8</code>, and nothing else.</p>',
     how:'<p>Click a parent SHA to jump to that commit and read the step before this one. Do it repeatedly and you are walking backwards through the project’s life.</p>',
     fail:'<p>A commit can have <em>two</em> parents. That is a merge commit — the moment two branches were joined — and its diff is confusing because it is being compared to two things at once. Module 5 explains where those come from.</p>',
     when:'<p>Bisecting a problem by hand: land on a broken commit, follow parents backwards, and find the last one that was fine.</p>'},

    {sel:'[data-h="d-summary"]', view:'diff', place:'bottom', title:'“1 changed file with 2 additions and 1 deletion”',
     what:'<p>The size of the commit in one sentence: how many files it touched, and how many lines went in and out.</p>',
     why:'<p>Before you read anything you want to know whether this is a typo fix or a rewrite. Three numbers give you that, and reviewers use them to decide what to read first.</p>',
     how:'<p>Read it as a smell test. One file, three lines: safe, read it in ten seconds. Forty files, 3,000 lines: something big happened and you should be suspicious of the message.</p>',
     fail:'<p>Git counts an <em>edited</em> line as one deletion plus one addition, because it works in whole lines. Changing a single character in a 200-character line shows as “+1 −1”, not as a one-character change. The numbers measure lines touched, not effort.</p>',
     when:'<p>Scanning a stranger’s pull request. A change described as “small fix” that says “+1,200 −40” deserves a much closer look.</p>'},

    {sel:'[data-h="d-hunk"]', view:'diff', place:'right', title:'@@ -1,5 +1,6 @@ — the hunk header',
     what:'<p>A blue-tinted signpost meaning “what follows is a section from around here in the file”. The first pair is the old file — from line 1, 5 lines. The second is the new file — from line 1, 6 lines. The <code>-</code> means before and the <code>+</code> means after.</p>',
     why:'<p>Showing an entire 900-line file to explain a three-line change wastes everyone’s attention. Git shows only the changed lines plus about three lines either side for context, and the hunk header tells you where in the file that fragment came from.</p>',
     how:'<p>Read the numbers when you need to know <em>where</em> you are. On real GitHub there is an expander at the left of this row: click it to reveal the hidden lines above or below, a chunk at a time.</p>',
     fail:'<p>Assuming the file only has 6 lines because that is all you can see. Your README has 11. A diff is a keyhole, not the room — reach for <strong>View file</strong> when you need the whole thing.</p>',
     when:'<p>A big commit with four separate hunks in one file. The headers are how you tell which part of the file each cluster of changes belongs to.</p>',
     note:'<p>The word is genuinely “hunk”. It is Git’s own term for one contiguous block of changed lines, and it shows up in error messages, so it is worth recognising rather than admiring.</p>'},

    {sel:'[data-h="d-del"]', view:'diff', place:'right', title:'The red line with the minus — what came out',
     what:'<p>A line that existed before this commit and does not exist after it. Red background, a <code>-</code> in the sign column, and a number in the left gutter but not the right — because it has no line number in the new file. It does not exist there.</p>',
     why:'<p>Colour and sign say the same thing twice on purpose. Red-green is fast but useless to roughly one in twelve men, so the <code>+</code>/<code>-</code> characters carry the meaning independently.</p>',
     how:'<p>The darker red patch inside the line is <strong>word-level highlighting</strong>: GitHub noticed the two lines are mostly the same and shaded only the part that actually moved. Read the pale red for “this line changed” and the dark red for “this is the bit that changed”.</p>',
     fail:'<p>Reading red as “deleted from the project”. This text is not gone — it is right below in green, on a line of its own. Red only ever means “not present in this version any more”, which very often means “moved” or “edited”.</p>',
     when:'<p>Reviewing your own change before you commit it. The red block is where you check you have not deleted something you still needed.</p>'},

    {sel:'[data-h="d-add1"]', view:'diff', place:'right', title:'The green lines with the plus — what went in',
     what:'<p>Lines that exist after this commit and did not exist before. Green background, a <code>+</code>, and a number in the <em>right</em> gutter only.</p>',
     why:'<p>Git compares files line by line, because a line is a unit humans naturally edit and it makes conflicts between two people’s work resolvable. Everything else about diffs follows from that one decision.</p>',
     how:'<p>Count what happened here: one line out, two lines in. That is why the summary says <strong>+2 −1</strong> for what you would describe as “I split a line in half”.</p>',
     fail:'<p>Because Git thinks in whole lines, a document written as one enormous paragraph produces a diff where changing a comma shows the entire paragraph as deleted and re-added. That is why people writing prose in Markdown often start each sentence on its own line.</p>',
     when:'<p>Every review you ever do. Green is the new work; red is what it displaced. Read green first, then check what red it cost.</p>'},

    {sel:'[data-h="d-toggle"]', view:'diff', place:'left', title:'Unified / Split — two ways of drawing the same change',
     what:'<p>A working toggle. <strong>Unified</strong> (on now) stacks deletions above additions in a single column. <strong>Split</strong> puts the old file on the left and the new file on the right.</p>',
     why:'<p>Neither view wins. Unified reads like a story and survives narrow screens; split makes an <em>edited</em> line obvious because before and after sit side by side. GitHub declined to choose for you.</p>',
     how:'<p>Press <strong>Split</strong>, read the same change again, then press <strong>Unified</strong>. Both buttons are wired up here. On real GitHub the choice sticks to your account across every repo.</p>',
     fail:'<p>Split on a phone or a narrow window is genuinely unreadable — two columns of monospace text in half a screen each. If a diff looks like word soup, switch to unified before you conclude the change is complicated.</p>',
     when:'<p>Reviewing a change where somebody rewrote a paragraph. Split shows you the old and new sentence on the same row; unified makes you hold the old one in your head.</p>'},

    {sel:'[data-h="d-viewfile"]', view:'diff', place:'top', title:'“View file” — the escape from the keyhole',
     what:'<p>Opens the whole file as it stood <em>at this commit</em> — not as it is today. Every file in a diff has one of these.</p>',
     why:'<p>Three lines of context is often not enough to judge whether a change is right. This is the shortest path from “what changed” to “what does the file actually look like now”.</p>',
     how:'<p>Click it on the file header. You land on the blob view with the commit pinned, so the URL contains the SHA rather than <code>main</code>.</p>',
     fail:'<p>Assuming it shows the current file. It shows the file at that commit, which may be many changes behind. If you edit from there, GitHub has to reconcile it with the present, and that is where confusion starts.</p>',
     when:'<p>Any diff where you find yourself asking “yes, but what is above this?” — that question is exactly what this button is for.</p>'},

    /* ---------- the browse-at-a-point view ---------- */
    {sel:'[data-h="b-flash"]', view:'browse', place:'bottom', title:'The warning bar: you are in the past',
     what:'<p>GitHub’s way of saying this page is a historical snapshot, not the live repo. It appears whenever the URL pins a specific commit instead of a branch.</p>',
     why:'<p>The past looks exactly like the present — same layout, same file list — so without a banner people genuinely do not notice. Editing from here is the classic beginner accident, and the bar is the guard rail.</p>',
     how:'<p>Read the SHA in the bar to know exactly where you are. To return to the present, click the repo name in the breadcrumb or the button at the top right.</p>',
     fail:'<p>Bookmarking a <code>/tree/&lt;sha&gt;</code> URL as “my repo”. It will still work in a year and it will still show you today — permanently frozen — while you wonder why none of your new work appears.</p>',
     when:'<p>Any time you follow a link from a commit, an old issue comment or a message from a classmate. Check the bar before you believe what you are looking at.</p>'},

    {sel:'[data-h="b-missing"]', view:'browse', place:'top', title:'What is missing here is the point',

  {type:'prose', title:'Reading a diff, condensed',
   html:
    '<p>Diffs are the one genuinely new skill in this module. Everything else on GitHub is a list of things; a diff ' +
    'is a notation, and notations have to be learnt once. Here is the whole notation.</p>' +
    '<ul>' +
      '<li><strong>Red, with a <code>-</code>:</strong> this line was in the file before and is not in it after.</li>' +
      '<li><strong>Green, with a <code>+</code>:</strong> this line is in the file after and was not in it before.</li>' +
      '<li><strong>No colour, no sign:</strong> unchanged context, shown only so you can see where you are.</li>' +
      '<li><strong>One red immediately followed by one green:</strong> a line that was edited. Git has no concept of ' +
      '“edited” — it can only say removed and added, so an edit always appears as one of each.</li>' +
      '<li><strong>Darker patches inside a line:</strong> word-level highlighting. GitHub worked out which part of ' +
      'the line actually differs and shaded only that.</li>' +
      '<li><strong>Two gutter columns:</strong> old line number on the left, new line number on the right. A red ' +
      'line has no right-hand number; a green line has no left-hand one.</li>' +
      '<li><strong><code>@@ -1,5 +1,6 @@</code>:</strong> the hunk header. Old file from line 1 for 5 lines; new ' +
      'file from line 1 for 6 lines.</li>' +
    '</ul>' +
    '<p>The one idea underneath all of that: <strong>Git thinks in lines</strong>. Not in words, not in paragraphs, ' +
    'not in meaning. It compares two versions of a file line by line and reports which lines differ.</p>' +
    '<p>That has a practical consequence for you specifically, because you write Markdown rather than code. If you ' +
    'write a 200-word answer as one long line, then fix one typo in it, the diff will show the entire 200 words as ' +
    'deleted and the entire 200 words as re-added, and nobody — including you — will be able to see what actually ' +
    'changed. Start each sentence on a new line in your journal files and every future diff becomes readable. ' +
    'Markdown joins them back together when it renders, so the output looks identical.</p>'
  },

    '<p>You <strong>revert</strong> it. GitHub adds a <em>new</em> commit that applies the exact opposite of the old ' +
    'one: every line the original added gets removed, every line it removed comes back. The project ends up in the ' +
    'state it was in before — and the history now contains both the mistake and the correction, in order.</p>' +
    '<p>That sounds like clutter. It is the opposite: it is the record telling the truth. The mistake happened. ' +
    'Pretending otherwise is how two people end up with different ideas of what the project even is.</p>' +
    '<h3>Revert versus reset</h3>' +
    '<ul>' +
      '<li><strong>Revert</strong> adds a commit that undoes an earlier one. Both stay visible. Safe on shared ' +
      'work, safe by default, and the only one of the two that GitHub offers you as a button in the browser.</li>' +
      '<li><strong>Reset</strong> moves the branch pointer backwards so that recent commits are no longer part of ' +
      'the story. It rewrites what the history claims happened. It is a local-Git operation, it is not something ' +
      'you can do by clicking on github.com, and on anything anyone else has already seen it causes real damage — ' +
      'their copy and yours now disagree about the past.</li>' +
    '</ul>' +
    '<p>The short version: reverting is booking a correcting entry. Resetting is going back and altering the ' +
    'original one. You will use the first constantly and should not touch the second for a long time.</p>' +
    '<h3>You committed something embarrassing</h3>' +
    '<p>It stays. Deleting the file in a later commit removes it from the <em>current</em> version and leaves it ' +
    'sitting in the history where anyone with access can read it. That is fine for a badly worded sentence and ' +
    'genuinely serious for anything secret.</p>'

  blurb: 'Your repo says “1 Branch” and you have never made a second one. Here is what the word means, what it protects you from, and the honest answer to whether you need one for a two-file assignment.',
  goals: [
    'Explain what a branch is well enough that it still makes sense when somebody asks a follow-up question',
    'Create a branch from the repo page, switch between branches, and know exactly what changes on screen when you do',
    'Read the branches page — default, ahead/behind, stale — and say what “2 ahead, 1 behind” means about two lines of work',
    'Say what a merge does, what causes a merge conflict, and why a conflict means nothing is broken'
  ],
  sections: [

  /* ============================ THE PROBLEM ============================ */
  {type:'prose', html:
    '<p class="tut-lead">Your README is being marked on Friday. It works — the headings render, the bullets are ' +
    'bullets, the marker can read it. And you want to rewrite the whole thing, because half of it is still ' +
    'template text and the degree line runs together.</p>' +
    '<p>So you are stuck between two bad options. Edit it now and the version being marked is whatever state you ' +
    'happened to leave it in when you got bored. Leave it alone until Saturday and you lose the three days you ' +
    'actually had time to work.</p>' +
    '<p>That tension is the entire reason branches exist. Not “version control best practice” — this specific ' +
    'feeling of wanting to change something while a working version has to stay standing.</p>' +
    '<p>By the end of this module you will also understand pull requests before Module 6 explains them, because a ' +
    'pull request is just a formal way of asking for one branch to be folded into another.</p>'
  },

  {type:'prose', title:'What a branch actually is',
   html:
    '<p>Here is the analogy worth keeping: <strong>a branch is a photocopy of the whole project that you can ' +
    'scribble on. Nothing you do to the photocopy touches the original until you deliberately staple it back ' +
    'in.</strong></p>' +
    '<p>Test it with the obvious follow-up questions, because a good analogy has to survive them:</p>' +
    '<ul>' +
      '<li><em>“Does making one copy my files?”</em> — In effect yes, and instantly, because Git does not actually ' +
      'duplicate anything. It writes down one new name pointing at the commit you are currently on. Two names, one ' +
      'pile of history, no copying. That is why making a branch is instant even on a repo with 40,000 files.</li>' +
      '<li><em>“Can I break main from the branch?”</em> — No. Commits you make on the branch attach themselves to ' +
      'the branch, and <code>main</code> keeps pointing exactly where it did.</li>' +
      '<li><em>“What if somebody changes main while I am working?”</em> — They can, and the two lines drift apart. ' +
      'GitHub tracks that drift and shows it as “ahead / behind”, which you will see later in this module.</li>' +
      '<li><em>“How does it get back in?”</em> — You merge it, deliberately, as a separate action. That is the ' +
      'stapling, and it never happens by accident.</li>' +
    '</ul>' +
    '<p>The mechanically accurate version, if you want it: <strong>a branch is a movable pointer to a ' +
    'commit</strong>. <code>main</code> is a label stuck on commit <code>109d091</code>. Make a new commit while ' +
    'you are on <code>main</code> and the label peels off and re-sticks to the new one. Make a second label called ' +
    '<code>fix-readme-formatting</code> and now two labels sit on the same commit — and from that moment they can ' +
    'move independently.</p>' +
    '<p>That is why the project can have several parallel lines of history at once. Every commit still points at ' +
    'its parent, exactly as Module 4 described. The branches are just labels marking the newest commit on each ' +
    'line, and any commit can have more than one child.</p>'
  },

  {type:'callout', variant:'tip', title:'Where the photocopy analogy stops being true',
   html:
    '<p>Two places, and both are worth knowing so the picture in your head does not mislead you later.</p>' +
    '<p><strong>A photocopy is frozen; a branch is not.</strong> If <code>main</code> moves on while you work, ' +
    'your branch does not automatically get those changes. It is a copy taken at a moment, and the original keeps ' +
    'going. That is exactly what “behind” means on the branches page.</p>' +
    '<p><strong>Stapling is not always trivial.</strong> If the original changed the same lines you scribbled on, ' +
    'somebody has to decide which version wins. That is a merge conflict, and it is covered at the bottom of this ' +
    'module — including why it is nowhere near as bad as it sounds.</p>'
  },

  {type:'prose', title:'main — the one branch you already have',
   html:
    '<p>Your repo says <strong>1 Branch</strong>, and that branch is called <code>main</code>. You did not create ' +
    'it. GitHub made it the moment you made the repo, because a repo with no branch has nowhere to put a commit.</p>' +
    '<p><code>main</code> is the <strong>default branch</strong>. That is a real setting, not a vibe. It is the ' +
    'branch GitHub shows when someone opens the repo, the one <code>/commits/main</code> reads from, the one your ' +
    'README is rendered from, and the branch a pull request will target unless you change it.</p>' +
    '<p>The convention everyone follows: <strong><code>main</code> should always be in a working state.</strong> ' +
    'On a code project that means it compiles and the tests pass. On yours it means the README renders correctly ' +
    'and the journal entry is complete enough to be marked. Anything half-finished belongs on a branch until it ' +
    'is not half-finished.</p>' +
    '<p>You will also see repos whose default branch is called <code>master</code>. It is the same thing — Git’s ' +
    'original default name. GitHub changed the default for new repositories to <code>main</code> in 2020, and ' +
    'existing repos kept whatever they had. Nothing about the mechanics differs; only the word does. If a ' +
    'tutorial tells you to look at <code>master</code> and your repo says <code>main</code>, they mean the same ' +
    'branch.</p>'
  },

    'type in it to filter existing branches, and if what you typed matches nothing, GitHub offers to create a ' +
    'branch with that name instead. <code>fix-readme-formatting</code> has been typed for you.</p>' +
    '<p>Click <strong>Create branch: fix-readme-formatting from main</strong> and watch what changes — and, more ' +
    'importantly, what does not. Then use the dropdown on the next screen to switch back and forth.</p>'
  },

            'And a blue banner appeared offering a <strong>Compare &amp; pull request</strong>, because GitHub has ' +
            'noticed a branch that is not <code>main</code> and is guessing what you will want next.</p>' +
            '<p>The thing to internalise: switching branches changes what the <em>entire</em> repo page shows. Not ' +
            'just the file list — the README underneath, the commit history, the commit count, the “Go to file” ' +
            'search results, all of it. You are looking at a different version of the project, not a different ' +
            'section of the same one. This surprises everybody the first time.</p>' +
            '<p>Nothing is lost by switching. The branch is still there — it is one row down in that dropdown, ' +
            'exactly where you left it.</p>'}},
     {on:'[data-h="o-here"]', toast:'The tick means you are already here. That is what the tick always means in this dropdown.'},

     {on:'[data-h="o-contribute"]', toast:'“Contribute” is the shortcut to opening a pull request from this branch. Module 6 opens one properly.'},
     {on:'[data-h="m-toBranch"]', view:'onbranch', toast:'Back on <span style="font-family:var(--font-mono)">fix-readme-formatting</span> — and everything on the page changed again.'},

   hotspots:[
    {sel:'[data-h="c-selector"]', view:'root', place:'top', title:'The branch selector — where every branch operation starts',
     what:'<p>The button that tells you which version of the project is on screen, and the only place on the repo page where you can switch to another one or make a new one.</p>',
     why:'<p>A repo can hold many parallel versions at once and they all live at the same URL. Something has to say which one you are looking at, or you would edit the wrong one and have no way of noticing.</p>',
     how:'<p>Click it and a dropdown opens under it (pinned open here so the markers inside stay clickable). It lists branches and tags, with a filter box on top.</p>',
     fail:'<p>Not looking at it. You switch to a branch, wander off, come back the next day, edit a file and commit — onto the branch, not <code>main</code>. Then you cannot understand why the front page has not changed. That is the single most common branch mistake and this label is the thing that prevents it.</p>',
     when:'<p>Every time you are about to edit a file on a repo that has more than one branch. Read the label first, edit second.</p>'},

    {sel:'[data-h="c-input"]', view:'root', place:'right', title:'The box at the top of the dropdown does two jobs',
     what:'<p>A filter and a create field in the same input. Type and it narrows the branch list. Type something that matches no existing branch and GitHub offers to create it.</p>',
     why:'<p>Real projects have dozens of branches, so a filter is necessary. Making branch creation the natural consequence of "that name does not exist yet" means there is no separate form to find.</p>',
     how:'<p>Click into it and type a name — <code>fix-readme-formatting</code> has been typed for you here. Watch the list below react to what you type.</p>',
     fail:'<p>Typing a name and pressing Enter while it still matches an existing branch: you switch to that branch instead of creating one. Read the row you are about to click, not the box you just typed in.</p>',
     when:'<p>Any time you are about to start something you are not sure will work. Naming it is the first step and it takes five seconds.</p>'},

    {sel:'[data-h="c-mainrow"]', view:'root', place:'right', title:'main, with a tick and the word “default”',
     what:'<p>Your one existing branch. The tick means it is the one you are currently viewing; <em>default</em> means it is the branch GitHub shows to anyone who opens this repo without specifying one.</p>',
     why:'<p>Something has to be the official version. The default branch is that decision, made once in Settings and then applied everywhere — the front page, the README, the pull-request target.</p>',
     how:'<p>Clicking a branch row switches to it. Clicking the one you are already on does nothing, which is why this row just produces a message here.</p>',
     fail:'<p>Assuming <code>main</code> is protected because it is special. On your repo it is not — you can commit straight to it, which is exactly what you have been doing five times so far. “Default” describes what GitHub shows, not what GitHub defends.</p>',
     when:'<p>When a repo you have cloned from someone else has a default called <code>develop</code> or <code>master</code>, and you need to know which line of history is the real one.</p>'},

    {sel:'[data-h="c-create"]', view:'root', place:'right', title:'“Create branch: fix-readme-formatting from main”',
     what:'<p>The row that makes the branch. Note the second half: <strong>from ‘main’</strong>. The new branch starts life pointing at whatever commit <code>main</code> is on right now.</p>',
     why:'<p>A branch has to start somewhere, and “wherever I am standing” is almost always what you want. GitHub says which branch it is copying from so you cannot do it from the wrong place by accident.</p>',
     how:'<p>Click it (it works). GitHub creates the branch and immediately switches you onto it. There is no confirmation step, because there is nothing to confirm — a branch costs nothing and deletes cleanly.</p>',
     fail:'<p>Creating the branch while you are standing on a <em>different</em> branch, so it inherits work you did not want. The “from ‘main’” text is where you catch that, and it is the part everybody skims past.</p>',
     when:'<p>Right before you rewrite that README. Branch first, rewrite second, and the version being marked on Friday stays exactly as it is.</p>'},

    {sel:'[data-h="c-count"]', view:'root', place:'bottom', title:'“1 Branch” — the counter you are about to change',
     what:'<p>How many branches this repo currently has. One, right now, and it is <code>main</code>. Click the create row and watch this become <strong>2 Branches</strong>.</p>',
     why:'<p>Branches are invisible from the file list — nothing about the files tells you three other versions exist. The counter is the only signal on the front page that there is more going on.</p>',
     how:'<p>Click the counter to open the full branches page, which is the second screen in this module.</p>',
     fail:'<p>A repo showing “14 Branches” usually means fourteen half-finished ideas nobody merged. Branches are cheap to make and easy to abandon, and the counter is the only thing that keeps the mess visible.</p>',
     when:'<p>Landing on an unfamiliar repo. A high branch count with old dates tells you the project is being worked on by people who do not finish things.</p>'},

    {sel:'[data-h="o-selector"]', view:'onbranch', place:'top', title:'The selector now says fix-readme-formatting',
     what:'<p>Same control, different label. You are on the new branch, and every part of this page is now showing that branch’s view of the project.</p>',
     why:'<p>The label is the answer to “where am I?” and it is deliberately the widest, most prominent thing in the toolbar, because getting it wrong is the expensive mistake.</p>',
     how:'<p>Read it before every edit. If it does not say what you expect, click it and switch before you touch anything.</p>',
     fail:'<p>Editing a file here while believing you are on <code>main</code>. The commit lands on the branch, the front page does not change, and you spend twenty minutes convinced GitHub lost your work. It did not — it is one dropdown away.</p>',
     when:'<p>Every single edit, forever. It is a two-second glance and it is the difference between confident and confused.</p>'},

    {sel:'[data-h="o-count"]', view:'onbranch', place:'bottom', title:'“2 Branches” — the count moved',
     what:'<p>The counter that said 1 a moment ago. Two named lines of history now exist in this repo, both currently sitting on the same commit.</p>',
     why:'<p>This is the cheapest possible confirmation that the branch was actually created. A number changing is easier to trust than a message that flashes past.</p>',
     how:'<p>Click it for the full branches page: who made each branch, when it was last touched, and how far apart the two lines have drifted.</p>',
     fail:'<p>Expecting the number to go back down on its own. Branches persist until somebody deletes them, including after they have been merged and are no longer doing anything.</p>',
     when:'<p>After finishing a piece of work, as a check that you actually merged and tidied up rather than leaving a branch dangling.</p>'},

    {sel:'[data-h="o-comparebar"]', view:'onbranch', place:'bottom', title:'“This branch is up to date with main”',
     what:'<p>A status bar that appears when you are viewing a branch that is not the default. Right now the two branches are on the same commit, so there is nothing to report.</p>',
     why:'<p>The question you have on a branch is always “how far apart are we?”. GitHub answers it at the top of the page rather than making you go and compare.</p>',
     how:'<p>Once you commit something here it changes to “1 commit ahead of main”, with a link to see exactly which commit. If <code>main</code> moves too, it also starts saying how far behind you are.</p>',
     fail:'<p>Ignoring the “behind” half. A branch that is 30 commits behind <code>main</code> is being built on a version of the project that no longer exists, and merging it will be painful in proportion.</p>',
     when:'<p>Before you merge anything. This one line tells you whether the merge will be trivial or a negotiation.</p>'},

    {sel:'[data-h="o-filebox"]', view:'onbranch', place:'left', title:'Identical files — which is the whole point',
     what:'<p>The same two files, the same commit message, the same timestamps, the same commit count. Creating a branch changed nothing about the contents of the project.</p>',
     why:'<p>A branch starts as an exact match of what it branched from. If it started as anything else, “nothing you do to the photocopy touches the original” would be false in both directions.</p>',
     how:'<p>Edit a file from here and the commit attaches to this branch. The identical file list on <code>main</code> stays identical until you merge.</p>',
     fail:'<p>Believing nothing happened because nothing looks different. People create a branch, see the same page, assume the click failed, and create three more. Check the selector and the counter — those are what changed.</p>',
     when:'<p>Any moment where you want reassurance that branching is not a destructive operation. It cannot be: it has not touched a single byte of your files.</p>'},

    {sel:'[data-h="m-prbanner"]', view:'backonmain', place:'bottom', title:'“fix-readme-formatting had recent pushes”',
     what:'<p>A banner GitHub shows on the default branch when another branch has been touched recently, with a shortcut to open a pull request from it.</p>',
     why:'<p>Work sitting on an unmerged branch is invisible from the front page. The banner exists so branches do not quietly rot — it is a nudge that something is waiting to be dealt with.</p>',
     how:'<p>Click <strong>Compare &amp; pull request</strong> and GitHub pre-fills a pull request from that branch into <code>main</code>. Module 6 walks through the whole screen.</p>',
     fail:'<p>Clicking it out of curiosity and opening a pull request you did not mean to open. It is not destructive — a pull request is a proposal, and you can close it — but on a shared project it does notify people.</p>',
     when:'<p>The moment you have finished the work on your branch and want it in the official version.</p>'},

    {sel:'[data-h="m-here"]', view:'backonmain', place:'right', title:'The tick moved to main',
     what:'<p>Same dropdown, two branches in it now, and the tick has moved to <code>main</code> because that is where you are standing.</p>',
     why:'<p>The tick is the only element in the list that answers “which of these am I on?”. Everything else in a branch list looks the same.</p>',
     how:'<p>Click <code>fix-readme-formatting</code> below it to switch back, and notice the URL and the banner change again.</p>',
     fail:'<p>Reading the tick as “this is the default branch”. It means “this is the one you are viewing”. The word <em>default</em> in small grey text is what marks the default, and on a repo with a different default those two will not be on the same row.</p>',
     when:'<p>Every time the dropdown has more than two entries and you have lost track of where you are.</p>'}
   ]
  },

  /* ============================ SWITCHING ============================ */
  {type:'prose', title:'What happens to your files when you switch',
   html:
    '<p>This is the part that unsettles people, so here it is plainly: <strong>you are just looking at a different ' +
    'version of the project.</strong> Nothing was deleted, nothing was moved, nothing was uploaded.</p>' +
    '<p>On github.com, switching branches is closer to changing which page you have open than to opening a ' +
    'different file. The repo page rebuilds itself from whichever branch you picked — file list, README, commit ' +
    'history, commit count, everything. Switch back and the previous view returns unchanged, because it was never ' +
    'gone.</p>' +
    '<p>The consequences worth holding on to:</p>' +
    '<ul>' +
      '<li><strong>Committing while on a branch commits to that branch.</strong> Not to <code>main</code>. This is ' +
      'the mistake, and it is entirely prevented by reading the selector before you edit.</li>' +
      '<li><strong>The front page always shows the default branch.</strong> Your work on a branch is real and ' +
      'saved and permanent — it is just not what a visitor sees until you merge.</li>' +
      '<li><strong>Nothing is ever lost by switching.</strong> The other branch is still there, still at the same ' +
      'commit, one dropdown click away.</li>' +
      '<li><strong>An uncommitted edit is not on any branch.</strong> If you are typing into GitHub’s editor and ' +
      'you navigate away without pressing the green commit button, that text existed only in your browser tab. ' +
      'Branches protect committed work, not unsaved work.</li>' +
    '</ul>' +
    '<p>If you later work on your own laptop with Git installed, switching branches genuinely does rewrite the ' +
    'files in your folder, and watching them change under you is startling the first time. Same idea, more ' +
    'visible. Nothing is lost there either.</p>'
  },

    '<code>fix-readme-formatting</code>, and one commit landed on <code>main</code> in the meantime — the week 7 ' +
    'journal entry, which had nothing to do with the README.</p>'
  },

   hotspots:[
    {sel:'[data-h="l-filters"]', place:'bottom', title:'Overview / Yours / Active / Stale / All',
     what:'<p>Five views of the same list. <strong>Yours</strong> is branches you created. <strong>Active</strong> is anything touched in the last three months. <strong>Stale</strong> is everything older than that.</p>',
     why:'<p>Branches accumulate. On a real project most of them are finished, merged and forgotten, and a flat list of 60 makes the four live ones impossible to find. The Stale filter exists so somebody can go and clean up.</p>',
     how:'<p>Click a filter to narrow the list. Your repo has two branches and zero stale ones, so all five views look nearly identical — that will not stay true.</p>',
     fail:'<p>Treating <em>stale</em> as <em>merged</em>. A stale branch might be unmerged work somebody abandoned three months ago. Check the ahead count before you delete anything on the strength of this label.</p>',
     when:'<p>End of semester, when you want to delete every branch you finished with and keep the one you did not.</p>'},

    {sel:'[data-h="l-mainrow"]', place:'right', title:'The default branch, in its own box',
     what:'<p><code>main</code> gets a separate section at the top rather than being sorted in with the others, because it is not the same kind of thing as the rest of the list.</p>',
     why:'<p>Every other branch is measured against this one. Putting it in its own box makes it obvious that it is the reference point rather than one option among several.</p>',
     how:'<p>The kebab menu on the right is where you would rename it or change which branch is default. Changing the default is a Settings-level decision and it changes what every visitor sees.</p>',
     fail:'<p>Renaming <code>main</code> without thinking. Every link anyone has to <code>/tree/main/…</code> breaks, and anyone with a local copy has to fix theirs by hand.</p>',
     when:'<p>Almost never for a repo like yours. Worth recognising on somebody else’s project where the default is called something unexpected.</p>'},

    {sel:'[data-h="l-defaultbadge"]', place:'bottom', title:'The “Default” badge',
     what:'<p>A small grey pill marking which branch is the repo’s official one. Exactly one branch has it at any time.</p>',
     why:'<p>“Default” is a setting, not a name. Without a visible badge you could not tell which of five branches GitHub actually shows to visitors, and the answer is not always the one called <code>main</code>.</p>',
     how:'<p>It is set in <strong>Settings → General → Default branch</strong>. Nothing on this page changes it; the badge just reports it.</p>',
     fail:'<p>Assuming the default is protected from direct commits. It is not, unless somebody turned on branch protection — which is a separate setting and off by default on personal repos.</p>',
     when:'<p>Opening an unfamiliar repo where <code>main</code>, <code>master</code> and <code>develop</code> all exist and you need to know which one is real.</p>'},

    {sel:'[data-h="l-branchname"]', place:'right', title:'fix-readme-formatting — the name is doing work',
     what:'<p>The branch you made. Lowercase, hyphens instead of spaces, and a name that says what the work is rather than who is doing it or when.</p>',
     why:'<p>Branch names show up in URLs, in pull request titles, in merge commit messages, and in every terminal that ever touches this repo. Spaces and capitals cause real friction in all of those places, so the convention hardened into lowercase-with-hyphens.</p>',
     how:'<p>Click the name to switch the repo to that branch. The three shapes you will see in the wild: <code>fix-readme-formatting</code>, <code>add-week7-journal</code>, and prefixed ones like <code>feature/portfolio-page</code> or <code>fix/broken-link</code> where teams want branches grouped by kind.</p>',
     fail:'<p>Naming it <code>test</code>, <code>new</code>, or <code>adam</code>. Three weeks later you have four of them and not one tells you what is inside. The name is the only description a branch ever gets.</p>',
     when:'<p>Every time you create one. Say what the change is, in three or four hyphenated words, and future-you can read the branch list like a to-do list.</p>'},

    {sel:'[data-h="l-aheadbehind"]', place:'top', title:'“1 — bar — 2”: behind and ahead, and what they mean',
     what:'<p>Two numbers with a bar between them. The left number, <strong>1</strong>, is how many commits <code>main</code> has that this branch does not — commits you are <em>behind</em>. The right number, <strong>2</strong>, is how many commits this branch has that <code>main</code> does not — commits you are <em>ahead</em>. Red on the bar is behind; green is ahead.</p>',
     why:'<p>Two branches that both keep moving drift apart in two directions at once, and “how different are they?” needs both numbers to answer. One number would hide half the story.</p>',
     how:'<p>Read yours as a sentence: “this branch contains two commits of README work that <code>main</code> has never seen, and it is missing one commit — the week 7 journal entry — that landed on <code>main</code> after I branched.” Click the bar on real GitHub to see exactly which commits those are.</p>',
     fail:'<p>Letting the behind number grow. A branch 40 commits behind is built on a version of the project that no longer exists, and merging it means reconciling six weeks of other people’s decisions in one sitting. Merge early, merge small.</p>',
     when:'<p>Before every merge, and any time a branch has been sitting untouched for a while and you are wondering whether it is still viable.</p>',
     note:'<p>These two numbers are also the honest measure of risk. Ahead-only means a clean, boring merge. Ahead <em>and</em> behind, with both sides touching the same file, is where merge conflicts come from.</p>'},

    {sel:'[data-h="l-branchrow"] .gh-branchrow__meta', place:'bottom', title:'“Updated 3 hours ago by jordan-lee”',
     what:'<p>Who last committed to this branch, when, and the short SHA of that commit — <code>8c14b60</code>, which is the newest commit on this line of history.</p>',
     why:'<p>On a shared repo this row answers “is anyone still working on this, and who do I ask?” without opening anything. It is the difference between a live branch and an abandoned one.</p>',
     how:'<p>Click the SHA to open that commit and read its diff. Everything you learnt in Module 4 applies unchanged — a commit on a branch is an ordinary commit.</p>',
     fail:'<p>The timestamp is the last <em>commit</em>, not the last time somebody thought about it. A branch untouched for two months is usually dead, but occasionally it is somebody’s carefully parked work. Ask before deleting on a shared project.</p>',
     when:'<p>Group work, when four branches exist and you need to know which one is the one everybody is actually building on.</p>'},

    {sel:'[data-h="l-newpr"]', place:'top', title:'“New pull request”, on every branch row',
     what:'<p>A one-click start to proposing that this branch be merged into <code>main</code>. Every branch that is ahead of the default gets one of these buttons.</p>',
     why:'<p>The overwhelmingly common next step for a branch with work on it is “get this into main”. GitHub puts the button where the branches are, so you do not have to go and construct the comparison yourself.</p>',

    '<p>Merging answers one question: how do the commits that exist only on this branch become part of ' +
    '<code>main</code>? There are two shapes it can take, and the difference is worth ninety seconds of your ' +

    '<code>main</code> all along. That is what the screen above did.</p>' +
    '<h3>Merge commit</h3>' +
    '<p>If <code>main</code> gained commits of its own while you were working, sliding the label forward would ' +
    'throw those away. So Git makes a brand-new commit whose job is to say “these two lines of history join here”, ' +
    'and gives it <strong>two parents</strong> — one on each line. That is the two-parent commit Module 4 warned ' +
    'you about, and now you know where they come from.</p>' +
    '<p>You do not choose between these. Git looks at whether <code>main</code> moved and picks. The only reason ' +
    'to know the names is that GitHub uses them in its buttons and its messages, and “this branch can be ' +

    '<h3>And then the actual answer</h3>' +

    'the combined diff on display, a comment thread attached, and somewhere for a reviewer to say yes. On any ' +

  {type:'callout', variant:'warn', title:'Merge conflicts: nothing is broken and nothing is lost',

    'does that occasionally is worse than one that stops and asks every time.</p>' +
    '<p>What GitHub shows you is a pull request that will not merge, with a <strong>Resolve conflicts</strong> ' +
    'button. Click it and you get an editor showing both versions of the disputed lines, wrapped in markers ' +
    '(<code>&lt;&lt;&lt;&lt;&lt;&lt;&lt;</code>, <code>=======</code>, <code>&gt;&gt;&gt;&gt;&gt;&gt;&gt;</code>). ' +
    'You delete the markers and whichever text you do not want, leaving the version that should exist. Then you ' +
    'mark it resolved and merge.</p>' +
    '<p>The reassurance, because beginners always assume the worst: <strong>a conflict destroys nothing.</strong> ' +
    'Both versions are still in their own branches, both are still in the history, and the merge has not ' +

  id: 'pull-requests',

  title: 'Pull requests: how changes get discussed and merged',
  blurb: 'The one thing on GitHub with no equivalent anywhere else in computing, wearing the most unhelpful name in software. Here is what it actually is and why it is worth using even on your own.',
  goals: [
    'Say in one sentence what a pull request is, and why the name is misleading',
    'Read every part of a PR page — the state pill, the branch bar, the four tabs, the timeline and the merge box',
    'Review a change line by line, and choose between Comment, Approve and Request changes',
    'Pick the right merge strategy out of the three in the dropdown, and say why',

  sections: [

  /* ======================================================================
     1. START FROM THE PROBLEM
     ====================================================================== */
  {type:'prose', html:
    '<p class="tut-lead">Module 5 left you holding something: a branch called <code>fix-readme-formatting</code> ' +
    'with two commits on it that fix the README. The change is good. It is also stuck. It lives on a branch ' +
    'nobody looks at, and <code>main</code> — the version anyone actually reads — still has ' +
    '<em>e.g. IronCondor</em> in it.</p>' +
    '<p>So: how does the change get into <code>main</code>? On your own you could just merge it and be done. ' +
    'But three questions appear the moment anyone else is involved, and they appear even when nobody is:</p>' +
    '<ul>' +
      '<li><strong>Who checks it first?</strong> Not “is it perfect” — just “has one other pair of eyes seen this ' +
      'before it becomes the official version?”</li>' +
      '<li><strong>Where does the conversation happen?</strong> If your tutor thinks line 5 is wrong, where does ' +
      'she write that? Email is detached from the code. A group chat scrolls away.</li>' +
      '<li><strong>How does anyone know what changed, exactly?</strong> Not “I fixed the README” — the literal ' +
      'lines, before and after.</li>' +
    '</ul>' +
    '<p>A pull request is GitHub’s single answer to all three at once. It is a page that holds a proposed change, ' +
    'shows the exact lines it would alter, carries the discussion about it, and finishes with a button that ' +
    'performs the merge. Nothing on your laptop does this. It is the reason teams use GitHub rather than a shared ' +
    'folder.</p>'
  },

  {type:'callout', variant:'warn', title:'The name is wrong and it is not your fault',
   html:
    '<p><strong>Nothing is being pushed and nothing is being pulled by you.</strong> The name is a historical ' +
    'artifact. It comes from the era before GitHub, when contributing to a project meant emailing its maintainer ' +
    'a message that said, in effect, “my copy is at this address — please <em>pull</em> my changes into yours.” ' +
    'GitHub put a button on that email and kept the name.</p>' +
    '<p>So the word “request” is the honest half: you are <em>asking</em>. Opening a pull request changes nothing ' +
    'about <code>main</code>. It is a proposal sitting on a page, and it stays a proposal until somebody presses ' +
    'Merge. On your own repo that somebody is you, ten seconds later. On someone else’s it might be never.</p>' +
    '<p>Every time you read “pull request” in this module, the phrase in your head should be ' +
    '<strong>“a proposed change, with a discussion attached.”</strong> GitLab, GitHub’s main rival, calls the ' +
    'same thing a “merge request”, which is a better name for exactly this reason. Everyone shortens it to ' +
    '<strong>PR</strong> anyway.</p>'
  },

  {type:'prose', title:'A pull request is three things stacked on one page',
   html:
    '<p>Most beginners see the comment thread, assume a PR is a forum post, and are then baffled by everything ' +
    'else on the screen. It is actually three separate objects sharing a URL, and once you can see the seams the ' +
    'page stops being noisy.</p>' +
    '<p><strong>1. A proposed merge.</strong> Every PR has exactly two branches attached to it: the ' +
    '<em>base</em> (where the change wants to go — almost always <code>main</code>) and the <em>compare</em> ' +
    'branch (where the change currently lives). The PR is a standing offer to fold the second into the first. ' +
    'That pair is printed at the top of the page and never changes for the life of the PR.</p>' +
    '<p><strong>2. A live diff.</strong> The <em>Files changed</em> tab shows every line the merge would alter. ' +
    'It is not a snapshot taken when you opened the PR — it recalculates. Push another commit to the branch ' +
    'tomorrow and the diff on this page updates by itself, the commit appears in the timeline, and anyone who ' +
    'already reviewed gets told there is new work. That is the whole reason a PR is a <em>page</em> and not a ' +
    'message.</p>' +
    '<p><strong>3. A comment thread.</strong> Comments on the change as a whole, plus comments pinned to ' +
    'individual lines of the diff, plus automatic entries recording every event — commits pushed, reviews left, ' +
    'labels added, the merge itself. It is a permanent transcript of a decision.</p>' +
    '<p>Here is one, built on your repo. It does not exist on the real github.com — your repo currently shows ' +
    '<strong>0 pull requests</strong>, and <code>course-tutor</code> is an invented reviewer so you can see what ' +
    'a review looks like. Everything else is exactly where GitHub really puts it.</p>'
  },

            '<tr><td class="gh-diff__ln">10</td><td class="gh-diff__ln">11</td><td class="gh-diff__sign"></td><td class="gh-diff__code">## One market story that hooked me</td></tr>' +
            '<tr class="gh-diffrow--del"><td class="gh-diff__ln">11</td><td class="gh-diff__ln"></td><td class="gh-diff__sign">-</td><td class="gh-diff__code"><span class="gh-diffword-del">&lt;</span>The 2010 flash crash, Living through story and seeing how companies were affected in real time, and how it <span class="gh-diffword-del">correletaed</span> to their stock prices falling.<span class="gh-diffword-del">&gt;</span></td></tr>' +
            '<tr class="gh-diffrow--add"><td class="gh-diff__ln"></td><td class="gh-diff__ln">12</td><td class="gh-diff__sign">+</td><td class="gh-diff__code">The 2010 flash crash. Living through story and seeing how companies were affected in real time, and how it <span class="gh-diffword-add">correlated</span> to their stock prices falling.</td></tr>' +
